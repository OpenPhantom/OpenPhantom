; characters.ini: what each actor's animation ordinals mean.
;
; Generated from a census of the level scripts and the models, and meant to be edited. A
; correction made here while looking at the character survives a rebuild of the fixes.
;
; Every value is an ordinal into THAT actor's own clip table. A key that is absent means the
; actor has no such animation and the runtime falls back: Run to Walk to Idle, Back to Walk,
; Fire to Attack, Jump holds the pose, Attack to nothing.
;
; DeathClips is every ordinal on that actor that is a death, which is a different
; question from Death: Death says which one to play, DeathClips says whether the body
; is already playing one and should be left alone. An actor with two die clips has
; both here.
;
; Source says where the ordinal came from. script is the level's own AI, which said what
; that actor plays in that state; usage is the role tag authored in the model; name is the
; clip name, which agrees with the other two in 90 per cent of the cases where both speak.
;
; An Action line is a clip the fourteen roles above did not take, written as
;
;     Action = <ordinal> <the name the artist gave it> <the model's playback mode word>
;
; and it is every clip the roles above left over: the actor's own clip table minus the roles,
; in ordinal order, with a second clip of the same name left out; no other rule chooses it,
; and nothing in the generator knows what any of these animations depicts. The mode word is
; the descriptor's own +0x14: bit 0 stops on the last frame, bit 1 stops and marks the track
; held, bit 2 wraps to the loop start, bit 3 arms the event marker. A clip carrying one of
; the first three does not end by itself, which is what holds and loops mean here.

; 164 actors, of the 222 the levels place and the 265 extracted.

