; Xidi configuration for The Phantom Menace.
;
; Xidi provides a WinMM that speaks XInput underneath, so a modern controller works with a game that
; predates it. This file is the mapping from an Xbox pad to what this game actually reads.
;
; It ships beside engine_fixes.ini and belongs next to WMAIN.EXE. Xidi runs without it, using its own
; defaults, but those defaults know nothing about this game: the camera would sit on no stick at all
; and the menu keys on nothing.
;
; The game reads controllers through WinMM, taking joyGetPosEx, joyGetNumDevs and joyGetDevCapsA from
; it, which is why the WinMM form of Xidi is the one installed and not the DirectInput one.

[Mapper]
Type                = PhantomMenace

[CustomMapper:PhantomMenace]

; Movement on the left stick, the way the game already reads its two joystick axes.
StickLeftX          = Axis(X)
StickLeftY          = Axis(Y)

; The camera on the right stick. It is delivered as mouse movement rather than as a third and fourth
; axis because that is what this game turns the view with; there is no second stick in a 1999 engine
; to bind to. Only the horizontal half is mapped: the vertical would fight the engine's own aim
; handling rather than add to it.
StickRightX         = MouseAxis(X)
StickRightY         = null

ButtonA             = Button(1)
ButtonB             = Button(2)
ButtonX             = Button(3)
ButtonY             = Button(4)
ButtonLB            = Button(5)
ButtonRB            = Button(6)

; The triggers are reported as buttons rather than as analogue axes, because the game has no use for
; how far a trigger is pressed and only asks whether it is.
TriggerLT           = Button(7)
TriggerRT           = Button(8)

; Two keyboard keys rather than joystick buttons, because these two screens are reached by key and
; the game offers no controller binding for either.
ButtonBack          = Keyboard(F1)
ButtonStart         = Keyboard(ESCAPE)

ButtonLS            = Button(11)
ButtonRS            = Button(12)

DpadUp              = Pov(Up)
DpadDown            = Pov(Down)
DpadLeft            = Pov(Left)
DpadRight           = Pov(Right)
