; Engine fixes, one section per DLL.
;
; This file belongs next to WMAIN.EXE, together with dinput.dll. The feature DLLs go in mods\.
; A section whose DLL is not installed is ignored, and every setting has the same default in the
; code, so you can delete anything you do not want to change.
;
; The log is engine_fixes.log, next to this file. It names every site that resolved and every
; patch that was applied or refused.
;
; If you installed with the OpenPhantom installer it replaces this file on every install and keeps
; your old one as engine_fixes.ini.previous, so copy anything you had changed across from there. It
; also asks for two of the settings below in the wizard and writes them in afterwards: Scaling under
; fmv_player, and the frame rate under framerate_fix, which is TargetFps, MatchDisplayRefresh and
; RefreshDivisor together.

; ==================================================================================================
; loader
;
; dinput.dll. Patches nothing itself; loads every DLL in mods\ at the game's entry point.
; ==================================================================================================
[loader]
Enabled=1

; Where the mods live, relative to WMAIN.EXE.
ModDirectory=mods

; We take the dinput.dll name, so whatever answered to it before needs a new one. Looked up in
; this order: ChainDll, then <game>\dinput_orig.dll, then the system dinput.dll. If you already
; had a graphics wrapper or ASI loader there, rename it to dinput_orig.dll and it keeps working:
; every export is forwarded to it.
ChainDll=

; ==================================================================================================
; variable_fov
;
; Adjustable field of view, with a slider in Options, Video.
; ==================================================================================================
[variable_fov]
Enabled=1

; 0  keep the authored vertical angle and widen horizontally (recommended)
; 1  keep the authored 60 degree horizontal and let the vertical follow the frame
; 2  change nothing. An unpatched executable behaves the same way
AspectMode=0

; The authored 4:3 vertical angle. 30 to 60.
BaseVerticalDegrees=46.826

; Added on top of the computed horizontal angle. The slider writes this key.
;
; 0 ships, because 0 is the original picture: AspectMode above already keeps the authored vertical
; angle and widens horizontally by exactly what the screen shape asks for, which is 60 degrees at
; 4:3 as the game was made. Anything here is a taste on top of that, and it is not free. A wider
; view shows ground the original never showed while the distance at which an enemy is created has
; not changed, so pop-in becomes visible where it never was. Set it from the slider if you want it.
ExtraDegrees=0.0

; Written by the game, never read by it: the width the picture would have with ExtraDegrees at
; zero. Editing it does nothing and it is rewritten from the projection.
;
; It exists because ExtraDegrees above is an OFFSET from a base that depends on the canvas, the
; aspect mode and the engine's own projection, so on its own it is a number nothing outside that
; DLL can interpret. The developer menu's field of view slider needs degrees, and with this
; published the width is simply BaseFov plus ExtraDegrees, both of them here in the file.
;
; The BASE is published rather than the current width. The width moves
; every time the offset does, which is every frame of a slider being dragged, so a reader working
; the base out as "width minus offset" would pair a width written a moment ago with an offset
; written just now, and the base would drift by the size of the last drag step. The base itself
; moves only when the resolution or the aspect mode changes, so there is nothing to go stale.
BaseFov=0.0

; The 3D front end menu uses a fixed focal length and would otherwise shrink into the middle of a
; large screen. 0 fill the screen width, 1 keep 4:3, 2 leave it at 640 pixels.
;
; A file without this key gets 0. This file has said 2 since the first release, and it is the
; shipped choice. The operand this key drives belongs to variable_fov alone, and it is repointed
; whether or not enhanced_resolution is loaded. What changes with the menu scale on is whether
; the instruction that reads it runs: enhanced_resolution detours the function around it and
; places the 3-D widgets from the live lens itself, calling the engine's own body only when the
; scale has stood down or there is no lens to read. So the number takes effect when the menu
; scale is off, stood down, or has no lens, and is not consulted otherwise.
Menu3dMode=2

; Put a field of view slider on the game's own video options screen. 0 ships.
;
; That screen did not have one in 1999, and this adds a widget to it. It ships OFF so the screen
; looks as it did, and the developer menu carries a row that turns this and the two check boxes on
; the controls screen on together.
;
; The setting itself is not affected either way: ExtraDegrees above is the field of view, and the
; developer menu has its own slider for it. This decides only whether the game's own screen offers
; it too.
;
; Read once, while the game starts, because the screen is built by repointing the engine's own
; widget table and nothing here puts such a table back. Changing it takes effect on the next launch.
;
; The slider selects an absolute horizontal angle, so the two numbers below are what its caption
; shows. 60 is the floor because that is the authored angle at 4:3. Steps of 2 degrees.
MenuSlider=0
SliderMinFovDegrees=60
SliderMaxFovDegrees=120

; Slider caption language: en, de, fr, it or es. Empty follows the Windows UI language. The game
; has no language setting to read, since every language shipped as its own release.
Language=

; ==================================================================================================
; framerate_fix
;
; A free render rate that does not change how the game plays. At 30 fps every correction here is
; the identity, so the original behaviour is a fixed point.
; ==================================================================================================
[framerate_fix]
Enabled=1

; Process priority. 0 leaves it alone, 1 above normal, 2 high.
;
; The game is single threaded and saturates one core, so on a many core machine the task manager
; shows a low total while a busy background process takes the drawing thread's time slice. Every
; lost slice is a late frame, and with vertical sync a late frame costs a whole refresh interval.
;
; A precaution, not a repair: it has never been shown to fix anything. A load test with twenty
; eight busy workers on a twenty eight processor machine raised the late frame count measurably
; and changed nothing a player could see. 0 restores the system's own scheduling, and it is what
; a file without this key gets: the precaution is taken for a fresh install and not imposed on
; one that never asked.
ProcessPriority=1

; 0 removes the frame limiter. Otherwise a cap in frames per second, up to 1000.
;
; The installer asks for this on a page of its own and writes the answer here.
;
; 100 is what you fall back to. MatchDisplayRefresh below is on, so this number is only reached
; when it is turned off or the screen will not report a rate. Uncapped, this engine draws many
; hundreds of frames a second on a modern machine, which buys nothing a screen can show and costs
; a saturated core, a hot fan and a mouse whose reports thin out across the frames.
;
; A file without this key gets 0, and since MatchDisplayRefresh is on even when absent, the cap
; follows the display all the same; the 100 is the fallback a fresh install is given.
TargetFps=100

; Match the cap to the screen. On, and the setting to turn off if you would rather have the
; number above than a smooth picture.
;
; TargetFps above decides how fast frames are PRODUCED, and your screen shows them at its own
; rate. A cap that does not divide into your refresh rate means the screen shows some frames and
; repeats others on an irregular pattern, and without the wrapper's vertical sync it tears them as
; well. Everything in motion judders slightly, while the frame counter reads perfectly steady.
; The installer's dxwrapper.ini turns the vertical sync on from 1.4.4; it was forced off before.
;
; Measured on a 144 Hz screen: a cap of 100 leaves 44 refreshes a second repeating a frame, and a
; cap of 144 leaves none. On a 90 Hz Steam Deck OLED a cap of 60 leaves 30. Both were mistaken for
; a fault in the interpolation.
;
; With this on, the cap follows whatever the screen reports and TargetFps is ignored, which is the
; one setting that is both smooth and cheap. No limit at all is smooth too, but by drawing 300
; frames a second so that the screen always has a recent one, which loads a core fully for a 1999
; game. If the screen will not report a rate, TargetFps stands and the log says so.
;
; It is also on when the key is missing, so an installation carrying an older copy of this file
; still gets it.
MatchDisplayRefresh=1

; Which fraction of the screen's rate to cap at, while MatchDisplayRefresh is on. 0 decides by
; itself; 1, 2, 3 or 4 pins the screen's rate, its half, its third or its quarter.
;
; The screen's rate is only the right cap while the machine can hold it. A 240 Hz screen on a
; modest machine cannot, and neither can a wide in-game cutscene shot on a fast one: measured, a
; cutscene at 16:9 needs 8.5 ms of work a frame against the 6.94 ms a 144 Hz screen allows, so a
; third of its refreshes repeated a frame and it read as a dip in a game that was otherwise
; smooth. With the wrapper's vertical sync on, the only other caps that are even on a screen are
; its integer fractions, 144, 72, 48 and 36, where every frame is shown the same number of times.
; Without it a fraction tears on every second refresh, so the two go together.
;
; At 0 the cap watches each second of frames. When more than a tenth of them needed more work
; than the cap allowed it steps to the next fraction down, and after five seconds in a row with
; room at the faster one it steps back, so a heavy shot costs the rate it needs and no longer.
; Holding the lower rate for the whole level was tried and felt wrong. A new level starts at the
; screen's rate; the level opening is read on the world clock detour that RebaseSimClock and
; MoverSubstepClock share, so with both of those off the fraction is kept across levels. One
; long frame a second is a hiccup and moves nothing; a menu, a pause or a loading screen decides
; nothing. It never goes below 30 a second, so a 60 Hz screen stops at its half. Every step is
; one line in the log with the frame times that caused it.
;
; A number pins the fraction for good, for the player who knows the machine holds 72 and wants it
; to stop deciding. The dev menu's Frame rate group has the same choice as a row.
RefreshDivisor=0

; Rescale the camera dampers for the real frame time. Without this the camera turns rigid above
; 30 fps.
CompensateCamera=1

; The camera anchor is a fifth damper and the only one that is not a constant, so it needs its own
; switch: one of the four patches here that rewrite instructions rather than an operand, and the
; only one with a key of its own. Turn it off first if the camera behaves oddly. At 30 fps it
; changes nothing either way.
CompensateCameraAnchor=1

; Compensate the camera during a scripted camera as well. 0 ships.
;
; The compensation above smooths the camera between simulation steps, which is right when the
; player is driving it and wrong when a script is: a scripted camera is already being moved to
; an authored path on the engine's own clock, so smoothing it a second time fights the author
; rather than the frame rate. Off means a cutscene camera is left exactly as the script placed
; it.
;
; Turn it on only to compare the two; there is no known case where it looks better.
CompensateCameraInCutscenes=0

; Keep the camera's two position samples two substeps apart while the player rides a mover. On.
;
; The camera follows the player through a pair of samples, the last simulation step's position
; and the one before it, and draws each frame between them. While the player stands on a lift
; or a platform the game feeds that pair twice a step with the same position, so both samples
; are the same one and the camera moves in 32 Hz steps for the whole ride. At 30 fps that was
; invisible; at 72 or 144 it is a platform that judders along its path while everything else,
; even the people standing on it, looks smooth. Measured on Coruscant: the platform advanced
; the same 0.0205 units every frame while the camera advanced 0.014 on one frame and 0.026 on
; the next. This lets the pair rotate once a step and changes nothing else about the camera.
; 0 restores the shipped behaviour.
CameraTargetPair=1

; The animation clock (water, scrolling textures) and the particle emitter dormancy counter.
CompensateAnimation=1

; Leave at 1. To run the animation clock the engine's own way instead, set CompensateAnimation=0;
; that is smooth but runs the water at fps/30 times its authored speed.
AnimationClockMode=1

; Sleep(1) instead of Sleep(0) in the frame wait. Drops a busy core from 100 percent to a few
; percent, at the cost of up to about 1 ms of overshoot per frame. Off by default because the
; original really does spin.
SpinSleep=0

; Hold the simulation step at 1/32 s so a high frame rate cannot double NPC gravity, the turn ramp
; and the pathfinding rate. Leave this on.
PinSimulationRate=1

; Interpolate the drawn pitch and roll the way the engine already interpolates yaw, and rebuild the
; joint matrices every frame. Neither touches a simulation value.
InterpolatePitchRoll=1
PosePerFrame=1

; A scripted actor asks whether its turn has finished by polling a flag that the animation
; system raises once per rendered frame but that the script reads once per simulation step.
; Below 32 fps some frames run two steps back to back and the second one still sees it clear,
; which is how the shipped game ever took the 'still turning' branch. At or above 32 fps that
; never happens, and a scripted scene whose only progress hangs off that branch stalls for
; good, which in the swamp leaves the player unable to move.
;
; This hands the script a 'still turning' answer on one simulation step in N, and only for a
; clip that has already clamped at its last frame, so nothing visible is delayed. 0 switches
; it off, valid range 2 to 64. The default of 16 gives 2 Hz, the rate 30 fps produced.
FaceLatchYield=16

; Draw doors, lifts and platforms between the simulation steps, the way the engine already draws
; every object in its own list. Without it they hold still for several frames and then move a whole
; step at once, so they look stepped while everything else is smooth. At 32 fps it
; is the identity.
InterpolateMovers=1

; Put movers back on the simulation's clock. On by default, and unlike everything above it this
; changes how movers move rather than how they are drawn.
;
; The cause of the residual mover jitter, rather than a compensation for it. The simulation sets
; the world clock to the end of each substep clamped to the frame's own target time, so the last
; substep of every frame leaves it short. A mover works out its own step from the difference
; between two of those values, so its sample pair spans the gap between frames while the alpha
; that blends it is a phase within a 31.25 ms simulation step. At 60 fps the drawn speed comes out
; 1.07x on the wide intervals and 0.53x on the narrow one: a half-speed step lasting one substep,
; about every 250 ms. At the authored 30 fps the mismatch is seven per cent, so the
; original never showed it.
;
; With this on, the clamp is removed. Every mover integrates exactly one simulation step per
; substep, its sample pair spans exactly one step, and the substep alpha becomes the correct
; weight for the platform and for a character riding it at the same time, at any frame rate. No
; extra weight, no extrapolation, nothing to tune.
;
; What it costs. The world clock runs up to one substep ahead of the frame's time, which is where
; the object simulation already is. The average rate is unchanged, so nothing speeds up or slows
; down; what shifts is phase, by under 31 ms, for every other reader of that clock: the timer and
; dwell opcodes, the sound scheduler, the light ramps, the surface animation and the save counter.
; A constant offset of up to one step also remains for the level, because the first value after a
; level opens has no predecessor to be measured against.
MoverSubstepClock=1

; The furthest a mover may travel in one simulation step, in world units. A larger step is a track
; wrapping back to its start, or a teleport, and is drawn as the jump it is rather than smeared
; across the level. 0 disables the test and leaves only the rotation guard.
MoverTravelLimitPerStep=64.0

; A diagnostic, off unless something is being investigated. Writes one line every 600 frames
; saying how many drawn frames disagreed with their neighbours by more than five per cent, which
; is what jitter is: a frame that jumps and the frame that holds after it. Only meaningful at a
; steady frame rate, because a drawn object correctly moves further on a longer frame, so an
; uncapped run reads badly with nothing wrong at all.
LogMoverEvenness=0

; The same question for whoever STANDS on one. A character riding a platform judders against
; the floor under it, and the cause is not the platform: the engine draws every object between
; its previous and current position, and a carried character has its previous overwritten with
; its current one inside the same simulation step, so there is nothing left to draw between.
; It steps 32 times a second while the platform under it is drawn every frame.
;
; Measured before it was changed: walking, the pair differed on all 2111 frames sampled;
; riding, it was identical on all 600. This keeps the previous position in the patch instead.
; Nothing the simulation reads is written and no engine record is touched; an object with no
; remembered position falls back to the engine's own pair, as it did before this existed.
;
; 2 and 3 are measurements rather than settings, kept because both were needed to get this
; working and the next fault on this path will want them again. 2 places the patch and keeps
; the engine's own arithmetic, so the game should look untouched; if it does not, the fault is
; the patch rather than anything remembered here. 3 draws with the engine's values as well but
; reports, every 200 frames, how far the remembered previous position was from the object's own
; at its worst.
InterpolateRiders=1

; World units a CHARACTER may cross in one simulation step before the blend refuses it and
; draws it where it landed. This is the number the first attempt got wrong: it was 64, copied
; from the mover limit above, and a lift travels nothing like a character. Measured in play, a
; platform carries you 0.045 units per step and walking is about 0.017, so 2.0 leaves more than
; an order of magnitude of room.
;
; It has to be tight, because the distance is the only thing that separates a rider from a
; teleport. Both have a previous position identical to their current one; the rider really was
; a fraction of a unit away a step ago, while a spawn or a reused object was somewhere else
; entirely. Measured in the same run those sat 35, 44, 125 and 163 units out, and a limit of 64
; let the first two through and drew them smeared across the level.
;
; 0 switches the test off, which is not advisable.
RiderTravelLimitPerStep=2.0

; Particle position is a closed form in the clock, so drawing it at the instant the frame actually
; shows gives the exact position rather than a blend. Without this every spark and every smoke puff
; steps at the simulation rate while the world around it moves smoothly.
InterpolateParticles=1

; Compute the frame time in double. The engine subtracts two float32 timestamps that count seconds
; since the process started and are never reset, so their rounding grows with uptime: about 49 us
; of spread after ten minutes and 781 after two and a half hours, which is 12.5 percent of a
; 6.25 ms frame. Everything downstream inherits that, including the simulation accumulator.
PreciseFrameTime=1

; Take the same power of two off the render clock and the simulation clock now and then. Both are
; float32 accumulators, so their rounding grows as the level runs and the interpolation phase
; drifts; every so often a substep is drawn across four frames instead of five, which reads as a
; brief speed pulse. Subtracting from both leaves their difference untouched.
RebaseSimClock=1

; Measurement. Above 0, log a frame time summary every N frames, and dump the player's draw
; interpolation for N frames.
StatsFrameInterval=0
StatsPlayerFrames=0

; ==================================================================================================
; enhanced_resolution
;
; Modern resolutions in the options screen. The game is 16 bit only, so which modes exist at all is
; up to your DirectDraw layer (dgVoodoo2, DDrawCompat).
; ==================================================================================================
[enhanced_resolution]
Enabled=1

; How big the subtitles are, as a multiple of the size they have at 640x480.
;
; The engine lays subtitles out in a 640x480 box of fixed PIXELS and centres it, so the text
; keeps the same pixel size whatever the display is and shrinks into nothing as the resolution
; grows. This scales the whole box instead: the text, the line spacing, the line breaks and the
; panel behind them all grow together, fitted by height so the 4:3 box pillarboxes on a wide
; screen rather than running off the bottom.
;
; 1.0 is exactly the size and proportions the text has at 640x480. Larger is bigger; 0.5 to 3.0.
; It can be set from the developer menu, which has a row and a slider for it, and takes effect
; within a second without a restart.
;
; 0 leaves the engine's own behaviour alone, shrinking and all. That is the one value that needs
; a relaunch, because handing the box back means putting the patched instructions back.
SubtitleScale=1.0

; Lift the 4:3 restriction in the mode list. The 640x480 floor and the video memory test stay.
WidescreenModes=1

; Keep the engine's 64 mode records for modes it can actually use.
;
; The engine records every display mode the driver reports, in every bit depth, into a table of
; exactly 64, and it CANCELS the enumeration once that table is full. It then keeps only the
; entries whose bit depth is 16, because the mode list only ever accepts 16. On a driver that
; reports 8, 16 and 32 bit that spends two of every three records on modes the options screen can
; never show, so the list runs out after about 21 resolutions and which 21 depends on the order
; the driver enumerated in. That is why one machine shows every resolution and the next shows a
; third of them.
;
; With this on, a mode that is not 16 bit RGB, or whose resolution is already in the table, is
; answered without taking a record. Nothing is added and nothing the engine would have kept is
; dropped. On a driver that only reports 16 bit there is nothing to filter and this costs nothing.
FilterModeEnumeration=1

; The bit depth the mode list asks for. 16 or 32. Leave this at 16.
;
; 32 is not a supported setting and the game will not reach a level with it. It is here because
; the work to find that out was done and the answer is worth keeping: three engine sites decide
; the depth, and opening all three does produce a real 32 bit device, and the whole Direct3D
; scene draws correctly through it. What does not survive is the 2-D layer, which is software
; and never goes near Direct3D. Menu art is converted to 16 bits, run length compressed and
; written pixel by pixel into the locked back buffer, and two bytes a pixel is not confined to
; those blitters: it is written into allocation sizes and into literal byte counts all over the
; 2-D code. Silencing the menu blitter only moves the fault on to the next site that assumed it.
;
; Finishing this means auditing every software write to the back buffer rather than patching a
; handful of functions, so it is parked rather than half done. At 16 nothing below is touched.
ModeBitDepth=16

; The engine's label array holds 64 entries and does not bounds check, so cap what the enumerator
; returns. 4 to 63.
MaxMenuModes=63

; 0 leaves obi.ini alone. Otherwise force the startup resolution.
ForceWidth=0
ForceHeight=0

; Print the raw DirectDraw mode table to the log once, when it is first enumerated.
LogModeTable=0

; LogMenuArt
; Report every distinct menu picture once, with its size and which of the engine's two blit paths
; it takes. A measurement, not a feature, and it ships off.
;
; It was written to answer one question and the answer is now in the patch, so what is left is a
; diagnostic. The question was how much of a menu could be reached by enlarging pictures as the game
; loads them rather than on disk, because the engine has two blit paths and it was not known how the
; work divided between them. It counted enough of it that converting artwork on disk is optional,
; which is what lets the canvas follow the display. Keep it for measuring an install whose menus
; look wrong.
;
; With this on, walk the front end, the options screens, a pause page and the load screen. Each
; new picture shape writes one line as it first appears, and a summary follows the eighth screen.
; It only sees picture widgets, so a screen whose reported shapes plainly do not add up to what is
; on it is itself a finding.
LogMenuArt=0

; Measurement. Reports every call to the engine's own graphics_setResolution with the ADDRESS that
; made it, and changes nothing.
;
; It exists because SIX of that function's seven callers push 640x480, and MenuKeepsResolution
; below neutralises exactly one of them, the gate inside swmenu_enterMenuMode. A screen that
; drops to 640x480 while every other menu holds its size is therefore reaching it by one of the
; other five, and the address in the log is the only thing that says which. The seventh caller
; pushes -1,-1, which means re-read obi.ini. Capped at 32 lines a session.
LogResolutionCalls=0

; Stop every menu switching to 640x480, which costs a full device rebuild each time. The front end
; and the pause screens then sit as a 640x480 island in the middle of the picture.
MenuKeepsResolution=1

; The same thing for the ENDING, which is a separate switch the setting above never covered.
;
; Finishing the game appears to minimise it: the closing cutscene and the credits keep running and
; the game comes back as a small 640x480 window in the corner. That is a real mode change, made at
; 0x0043EF19 just before the last cutscene plays, and the credits merely inherit it. The retail game
; did the same and it was invisible on a machine already at 640x480; through a Direct3D 9
; translation layer at a modern resolution it costs the device its exclusive full screen.
;
; Removing it is safe even with no converted cutscenes: the engine's own movie player sets 640x480
; itself, so a film still gets the mode it expects, and the fmv_player plays at full size.
;
; It does NOT change the credits text spacing, which is authored for a 480 line screen and is a
; separate matter.
EndingKeepsResolution=1

; Escape leaves the end credits, which the engine otherwise gives no way out of.
;
; credits_screen reads no input at all: it never asks the menu system whether a key was pressed, so
; the crawl ends when the text ends and not before. On a finished game that leaves no way out but
; to kill the process.
;
; This does not cut the credits off. It tells the engine's own line reader that the text has run
; out, so the game ends them the way it ends them normally: the rows blank, the music fades over
; about four seconds, and the screen closes itself and releases its own files. That is a second or
; two slower than a hard cut and it is the game's own bow-out rather than a lurch.
;
; A controller's Start button works too, because the controller support synthesises the same key.
; A key still held from skipping the closing cutscene does not count; only a fresh press does.
SkipCredits=1

; Last resort, off by default. Moves and resizes the game window to match the display mode.
;
; Turn this on only if nothing renders at all and you have no wrapper installed, because that is
; the one case where the window can really end up smaller than the display mode. It costs you the
; engine's assumption that its window sits at screen 0,0, which its own pointer handling depends
; on, and it has produced a 2 fps report before: the window followed the mode down to 640x480 and
; the wrapper then downscaled a 2560x1440 render into it every frame.
FitWindowToMode=0

; The shape of the game's window. 0 ships and changes nothing.
;
;   0  authentic   leave the window exactly as the engine shapes it
;   1  borderless  frameless, at the true size of the monitor the window is on
;   2  windowed    a caption and a border, at a chosen size, centred on that monitor
;   3  resizable   the same, with a maximise button and edges the player can drag
;   4  borderless  no frame at all, at a chosen size rather than the whole monitor
;
; 2, 3 and 4 all take their size from WindowedWidth and WindowedHeight below, and all centre
; themselves. Only 1 ignores those and takes the monitor.
;
; What 0 actually is, because it is not what it sounds like: the engine calls its own
; stdWin95_setDisplayMode once while the renderer starts, asking for 2048 by 2048, a number chosen
; when no display could be that large. So the window the game runs in is frameless at roughly 2054
; by 2077 and anchored at the top left. It covers the screen only by being bigger than it, and on a
; display wider than about 2048 it does not cover it at all.
;
; 1 is therefore a correction rather than a new feature: the same frameless style, at the size of
; the monitor rather than at a number from 1999.
;
; 3 is only worth having with WindowedPresent on. The window procedure handles no WM_SIZE and the
; window class carries no redraw flags, so the engine is never told the window changed size and
; never will be. What makes it work anyway is underneath: with a windowed device the picture is
; scaled to the client area when it is presented, so the engine goes on rendering its own
; resolution and the result is stretched to whatever the window has become. The picture holds still
; while an edge is actually being dragged, because Windows runs its own loop during a drag and the
; game's is not being serviced; it catches up when the mouse is let go.
;
; 4 has no frame to grab, so it cannot be moved with the mouse without first pressing
; PointerReleaseKey, and even then there is nothing to drag. Use 2 or 3 for a window that has to be
; moved about.
;
; None of them makes Alt Tab cheaper on its own. This setting shapes the window; whether the device
; owns the display is WindowedPresent below. That setting removes the reset and the texture
; reload. The two are independent.
;
; On Linux and the Steam Deck this works in DESKTOP MODE and only there. Confirmed on a Deck: the
; game gets a real window with a frame and buttons, the desktop manages it like any other window,
; and cutscenes play inside it. Gaming Mode is a different thing entirely, a full screen compositor
; with no desktop for a window to sit on, so there is nothing for these modes to make a window out
; of. Leave this at 0 there.
;
; Read once, when the game starts.
WindowMode=0

; The client size for WindowMode=2, in pixels. Both 0 ship, which means "the resolution the game is
; rendering", so the picture is shown one pixel for one pixel and nothing scales it. Either is
; clamped to the monitor, because a window larger than the screen puts its own caption out of reach
; once it is centred. Each axis falls back on its own, so setting one and leaving the other at 0
; is a sensible thing to do rather than half a setting.
WindowedWidth=0
WindowedHeight=0

; EXPERIMENTAL. Let the game share the display instead of owning it. 0 ships.
;
; This is the setting that makes Alt Tab free. With it off the device is created exclusive
; fullscreen, so switching away loses every surface: the engine calls Restore and then throws the
; whole texture cache out, and each texture is uploaded again. That is the pause you see coming
; back, and no window setting can remove it, because it is the device and not the window.
;
; With it on, one byte inside the engine changes, the cooperative flags it hands DirectDraw, from
; Fullscreen and exclusive to normal. DDSCL_FPUSETUP is kept. Nothing else changes: the engine
; still sets its display mode, still creates the same flipping surfaces, still presents with the
; same Flip. Nothing is lost when focus goes, so there is nothing to restore and no textures to
; re-upload.
;
; LEAVE EnableWindowMode AT 0 IN dxwrapper.ini, which is how it ships. That key does not mean what
; its name suggests here: it arms the wrapper's own window management, which strips the caption and
; border off the game's window and recentres it to a size of its own choosing. With it at 0 the
; wrapper leaves the window alone and presents into whatever client area it finds, so the window
; settings above decide the shape.
;
; An earlier version of this setting rebuilt the whole device instead: no display mode, no flip
; chain, a clipper, an offscreen back buffer and a scaled blit to present. That is the arrangement
; the DirectX 6 and 7 samples use, and it was wrong here, because this engine reads its own front
; buffer back in two places, when a pause page opens and when the loading screen is built. A
; primary that is the desktop rather than the game's own mode makes both of those read a 32-bit
; desktop as 16-bit words. It is written up in the module's own header.
;
; It ships off because it changes what the game asks the display for. Turn it on deliberately and
; read engine_fixes.log afterwards; the line to look for is "windowed device armed".
;
; The dev panel writes this for you, alongside WindowMode, because there is only one value of
; it that works for each mode. A window needs it on: without it the device is exclusive, it
; owns the screen, and asking the engine for a smaller picture sets the real display resolution
; smaller, which was measured leaving a 4K desktop at 800x600. Fullscreen wants it off, because
; an exclusive device is what fullscreen is. Setting the pair by hand is still allowed and the
; panel will not argue; setting them to disagree is the one combination worth avoiding.
;
; This setting writes one key in dxwrapper.ini, and it is the only key in that file this patch
; ever touches. DdrawWriteToGDI under [Dd7to9] is set to match this one, because the wrapper
; uses it to decide how big the surfaces it hands the engine are: with it off they take the
; DESKTOP's size whatever resolution the game renders, which no windowed arrangement can use,
; so it is not really a second choice to make. Its name describes a blit that never runs for a
; Direct3D game, so it reads as unrelated.
;
; The write happens only when the two disagree, it is logged when it happens, and it does
; nothing at all when that file is not there. The wrapper reads its file once at startup, so it
; lands on the next run, which is the restart this setting needs anyway.
WindowedPresent=0

; WindowedFill
; Whether the picture fills the whole window when the window is not at the screen's origin.
;
; Only does anything with WindowedPresent=1, because the thing it corrects belongs to the graphics
; wrapper's windowed present path. That path clips before it copies, and it clips the surface
; rectangle, which begins at the origin, against the window's client rectangle expressed in DESKTOP
; coordinates. The two are in different coordinate spaces, so the result is only right when the
; client area happens to sit at the desktop origin. A window anywhere else receives part of the
; picture stretched across all of it. It looks like a rendering fault and is not one.
;
; With this on, the wrapper is given an empty client rectangle in exactly the case it gets wrong,
; so its clip finds nothing and it falls back to copying the whole surface, which the present then
; scales to the window. That fallback is the wrapper's own code; this only arranges for it to run.
; The correction is confined to that module and to that one case: everything else in the game,
; including the pointer confinement and the window measurement, still reads the true client area.
;
; Set it to 0 to see the uncorrected behaviour. Every release before this one behaved that way.
WindowedFill=1


; Recentre the pointer in the window rather than at the fixed screen point the engine warps to.
; Identity while the window is at screen 0,0, which is where the engine always left it. Released
; while another application is in front, so Alt Tab always frees the pointer.
KeepCursorInWindow=1

; Keep the pointer inside the window while the game is in front, and let go the moment it is not.
; Without it the pointer can cross the window edge between two mouse messages, walk onto a second
; monitor, and the next click takes the focus away. Released on Alt Tab, the Windows key, the task
; switcher, a minimise and on exit.
ClipPointerToWindow=1

; PointerReleaseKey
; A key that hands the mouse pointer back to Windows, so the game's window can be moved with it.
;
; Needed because switching the setting above off is not enough on its own. That one is this
; project's confinement; the engine has one of its own, and it is not a clip. It warps the pointer
; back to the middle of the client area on every mouse message, which is how it reads a relative
; mouse: it puts the pointer somewhere known, and the distance the next message arrives from is the
; movement. The pointer therefore cannot be walked out of the window, because every move towards
; the edge is answered by a warp back to the middle. The engine holds the mouse capture too, so a
; pointer that did get out would still send its clicks to the game rather than to what is under it.
;
; While released, the warp is skipped and the capture dropped: the pointer leaves the window,
; reaches the title bar and the buttons on it, and clicks what it is over. Press the key again to
; give it back to the game. The engine is sent no mouse movement while it is out, so the view does
; not jump when it comes back.
;
; The value is a Windows virtual key code, in decimal or 0x hex. 0 switches it off entirely and
; then nothing here is polled.
;
; The default 0x91 is Scroll Lock, which is the long-standing convention for handing a grabbed
; pointer back and is the one key nothing else wants: no game of this era binds it, and no
; overlay claims it. A function key would be a worse default even though the game itself leaves
; most of them alone, because Steam's overlay and several capture tools take F11 and F12.
;
; Keyboards without a Scroll Lock key are the reason this is a setting rather than a constant.
; 0x7B is F12, 0x5D is the menu key beside right Ctrl, and Microsoft's virtual key list has the
; rest.
;
; The pointer is invisible while it is over the picture, because the engine hides it there and
; keeps hiding it. It appears as the ordinary arrow the moment it crosses onto the window frame,
; which is where it is wanted.
PointerReleaseKey=0x91

; FullscreenToggleKey
; The key that, held with Alt, swaps between a window and the whole monitor.
;
; Alt+Enter is the gesture every windowed game has had for twenty five years, and a player who
; is in a window and wants the screen back should not have to open a settings panel to say so.
;
; It swaps WindowMode between 1 and whatever mode was in force before, so pressing it twice
; returns the window that was actually set up rather than a guess. The choice is written here as
; it happens, so it survives a restart.
;
; It does NOT change the resolution the game renders. The picture is scaled to the window either
; way, so this changes how much of the screen the game covers and nothing about what is drawn,
; and it costs nothing in either direction.
;
; Alt is required and is not configurable: Enter on its own is a key the game uses, and the
; modifier is both what makes it safe and what makes it the gesture people already know. Alt is
; bound in the engine's own key table, so whatever Alt does happens on the way through, which is
; true of Alt+Enter in every game of this era.
;
; A Windows virtual key code. 0 switches it off. The default 0x0D is Enter.
FullscreenToggleKey=0x0D

; Reacquire the DirectInput keyboard and mouse when the window comes back to the front. Windows
; unacquires both when the game goes to the background and nothing in the retail build ever
; acquires them again, so without this the game stops answering the keyboard after the first
; Alt Tab.
ReacquireInputOnFocus=1

; Widen the area the menu cursor may be moved in, from the 640x480 box the engine clamps it to,
; up to whatever size the menu canvas is being drawn at. This is not about where menus are drawn;
; the engine already centres those correctly. It is the cursor clamp, which would otherwise leave
; the pointer in a 640x480 box while MenuScale draws the widgets outside it. With MenuScale off
; the computed clamp is identical to the shipped one, so this changes nothing on its own.
;
; It stops at the canvas and deliberately does not follow the display mode. Outside the canvas
; nothing repaints, so a cursor allowed out there would stamp a copy of itself on every pixel it
; crossed. Every clickable widget is inside the canvas either way. MenuScale declines to install
; when this is 0, because scaled widgets with an unscaled cursor clamp are unreachable widgets.
; The setting below is a different defect and does not cover the cursor.
WidenMenuCursorArea=1

; Clamp the menu's own sprite draws to the menu canvas, but only while the engine's widget pass is
; what is drawing; the gameplay HUD and the frozen pause backdrop pass through untouched. This is
; the other half of MenuKeepsResolution: with the menus keeping a large resolution, a sprite that
; reaches past the canvas, the hovered button's halo does, is drawn against the screen but repaired
; against the canvas, so it stamps the border until the screen closes. A sprite that fits, which is
; every authored widget, passes through bit-identical, and so does a partially filled one, so this
; costs nothing when nothing is wrong. Leave it on.
ClampMenuSpritesToIsland=1

; How big to draw the menu canvas. 0 is automatic and is the setting that needs no thought. 1 is off
; and is exactly what shipped. Any other number is an explicit multiple of the authored 640x480,
; which exists for testing.
;
; The menus keep the display mode rather than dropping it to 640x480. That stops a full
; Direct3D 9 device rebuild every time one opens. The price is that the front end, the pause screens
; and the loading screen sit as a 640x480 island in the middle of the picture: around 15 per cent of
; the area at 1080p and under 4 per cent at 2160p. This makes the canvas itself bigger.
;
; The artwork has to grow with it, because the engine copies menu bitmaps one source pixel to one
; destination pixel and has no way to stretch one. It is enlarged as the game loads it, at whatever
; resolution is in force, so the menus follow the size you play at, including one you change in the
; options screen while the game is running. Nothing has to be prepared beforehand, nothing is
; downloaded, and no game file is read except the ones the game reads anyway.
;
; The one exception is an install that has artwork in the folder MenuArtDirectory names below. Then
; that artwork decides the canvas instead, so the layout and the pictures cannot disagree about the
; size. Files on disk are a fixed size, so the canvas is then welded to the resolution they were
; made for and cannot follow a change. That is the price of supplying your own pictures and it is
; worth saying; it is not a reason to avoid it if you have better artwork than the original.
;
; Refuses to install when WidenMenuCursorArea is 0, because the drawn cursor would stay caged in the
; old 607x447 box and every button outside it would be unreachable with nothing reporting it.
MenuScale=0


; A folder of your own menu artwork, relative to the game directory, mounted at the head of the
; engine's own resource chain so its files are found before big.lab and LOCALIZE.LAB. Empty
; declines the mount entirely.
;
; A missing folder is the normal case and is not an error: the menus are then sized from the display
; and the original pictures are enlarged as they load. Put pictures here only if you have better
; ones than the game's own, drawn rather than enlarged, because enlarging is already done for you
; and doing it on disk as well only fixes the menus to one resolution. Earlier versions of this
; patch shipped a converter that filled this folder; it did the same nearest neighbour enlargement
; the game now does by itself, so it has been retired and the installer offers to delete what it
; left behind.
MenuArtDirectory=menu_hd

; ==================================================================================================
; hud_ratio_scaling
;
; One size knob for the HUD, and glyphs that are not stretched.
; ==================================================================================================
[hud_ratio_scaling]
Enabled=1

; Make glyphs square outside the HUD. The renderer scales text by (W/640, H/480), so at 16:9 every
; character is a third too wide. Identity at 4:3.
SquareText=1

; Derive the bar widths from the screen height, the way the weapon icon already does, so the bars
; keep their authored shape at any aspect ratio. Identity at 4:3.
SquareHud=1

; One multiplier for the whole HUD: bars, weapon icon and both numbers, each about the edge it is
; anchored to. 0.25 to 4.0. With SquareHud=0 and HudScale=1.0 nothing is hooked at all, and a new
; value then needs a restart.
HudScale=1.0

; ==================================================================================================
; fmv_player
;
; Replaces the whole playback path for the pre-rendered movies. Where a converted file exists it
; plays through a 32 bit libVLC instead of Bink, never touching the engine's DirectDraw surface. A
; movie with no converted file falls through to Bink unchanged, so this is safe to install with
; nothing converted yet.
;
; The installer makes those files during setup, on Windows and on Linux alike. To convert again at a
; different size afterwards, tools\"Convert Movies.bat" on Windows or tools/convert_movies.sh on
; Linux and the Steam Deck; both drive the same converter Setup used.
;
; Which window the picture goes in is decided per movie and can be forced with MovieSurface below: a
; borderless window over the game on Windows, and inside the game's own window under Wine, where a
; second window would take the keyboard away for as long as the film lasted.
;
; Four things switch the feature off at startup and each says so in the log: Enabled=0, an
; unsupported build, the movie folder missing, and no 32 bit libVLC found. The cheap checks run
; first, so a machine with nothing converted never loads libVLC.
;
; The installer puts a libVLC in mods\fmv, and failing that a 32 bit VLC on the machine is used. A
; 64 bit VLC cannot be used at all, because this is a 32 bit process.
; ==================================================================================================
[fmv_player]
Enabled=1

; Where converted files live, relative to WMAIN.EXE. A retail movie name like "movie\arena" is
; looked up as <MovieDirectory>\arena.<Extension>, flat, no extra "movie\" subfolder beyond this
; one. The folder not being there is what tells this feature it has nothing to do, so libVLC is
; never loaded on a machine with nothing converted.
MovieDirectory=movies_hd
Extension=mp4

; Letterbox or stretch.
;
; The movies are roughly 4:3 and almost no screen is, so something has to give. letterbox
; keeps their own shape and puts black bars at the sides. stretch pulls the picture out to
; fill the screen exactly, which loses no image but makes faces a little wider.
;
; The choice is made when the movie plays, not when it is converted, so it applies to files
; you already have and costs nothing to change your mind about. Anything other than the word
; stretch is read as letterbox.
;
; The installer asks for this on a page of its own and writes the answer here.
Scaling=letterbox

; Which window the movie is drawn into. You do not need to set this: left empty as it ships, the
; right answer is worked out for each movie as it starts.
;
; What that decision is. A movie has to cover what you are looking at, and what you are looking at
; depends on the shape the game's window is in. The window the engine gives itself is frameless and
; larger than the screen, so the monitor is the honest answer there and a window of our own covering
; it is right. A game running in a real window is the opposite case: the monitor is not what you are
; looking at, and a movie covering it would black out your desktop and play several times the size
; of the game. So the game's own window is measured when each movie starts. One that covers its
; monitor gets a movie covering the monitor; one that does not gets a movie exactly the size of the
; game's picture. Move or resize the window between two movies and the next one follows it.
;
; What child is for on Linux. Under Wine a real Escape would not skip a cutscene, although the
; controller's Start button would and although Escape opened the menus perfectly well during play.
; The key was never reaching the game at all. A window of our own is a real window as far as Linux
; is concerned, the desktop gives a new one the keyboard focus, and the game then cannot be typed
; at for as long as the movie lasts. Drawing the movie INSIDE the game's own window creates no new
; window, so the focus never moves and the keyboard keeps working.
;
; This is a different problem from the black menu, which is the VideoOutput setting below. Both are
; handled automatically on Linux and neither needs an edit here.
;
;   auto    measured per movie, as described above. The default, and what empty means.
;   popup   always a window of our own, owned by the game's, covering the whole monitor. This is
;           what shipped before window mode existed. With the game in a real window it covers your
;           desktop as well, which is the reason it is no longer the default.
;   child   always drawn inside the game's own window. What auto chooses on Linux whatever the
;           window looks like, for the keyboard reason above.
;   game    no window of ours at all: the player is handed the game's own window. Never needed so
;           far, and here only as the last thing to try if neither of the others suits a machine.
;
; Anything else is refused and auto is kept, with a line in engine_fixes.log saying so.
MovieSurface=

; Which video output libVLC uses. You do not need to set this: left empty, as it ships, Windows
; leaves the choice to libVLC and Linux is given gdi automatically. It is here to be overridden and
; to explain itself.
;
; The Linux black menu, and what it actually was. Under Wine the cutscenes played and the main menu
; that followed was black, with the game still running, its sound audible and its frames still being
; drawn. MovieSurface above was written on the theory that the extra WINDOW lost the display; that
; theory was wrong, and drawing the movie inside the game's own window changed nothing. It was the
; DEVICE. libVLC's default video output on Windows is Direct3D, so a movie builds a SECOND Direct3D
; device while the game holds an exclusive mode one, and Wine never gives the game's back. An output
; that paints through GDI builds no device and cannot take anything away. Confirmed on Linux Mint
; under Lutris and on a Steam Deck.
;
;   (empty)      the shipped setting: libVLC's own choice on Windows, gdi under Wine.
;   gdi          the plain Windows blitter. No device, so nothing to take away.
;   opengl       or gl. Worth trying if gdi is slow or tears.
;   direct3d9    what libVLC picks by itself on Windows, named here for completeness.
;
; The name is passed straight to libVLC. One it does not recognise makes it fall back to its own
; choice rather than refuse, so a typo costs the wrong output and not the movie. The one actually
; in use is written to engine_fixes.log when libVLC finishes loading.
VideoOutput=

; A live probe on the player's own body around the level 6 opening cutscene measured a real
; position-settle transient, the player's authoritative position rather than its render blend,
; overshooting by 1.48 units and taking about 650 ms to read flat again, entirely under an engine
; position-override flag that retail's own resolution switch around every movie incidentally
; outlives before its picture is ever shown. This DLL's own faster transition does not spend that
; time, so it holds the overlay open, still solid black, for this many milliseconds after the movie
; itself has already finished, before the game is shown; that buys the same runway back without
; switching any resolution to do it. 0 disables it outright. Only applies to a movie played once a
; level and its player already exist; the two startup splash movies never get this hold.
PostMovieHoldMs=2500

; Cutting straight from the held black to the game is its own small jolt even once the settle above
; has actually finished, so the curtain fades out over this many ms afterward instead of simply
; vanishing. 0 skips the fade.
PostMovieFadeMs=300

; The curtain hides the picture, not the simulation: real frames keep ticking behind it, so a real
; scripted sound effect tied to the same settle transient still fires audibly even with nothing on
; screen. This suppresses that ONE scripted sound call directly (the level script's own opcode 0x603
; "Sound" call, right next to the cutscene lock in the same script) until the position-override flag
; driving the transient clears, or the curtain's own timer runs out, whichever comes first. It is
; not a volume mute, so dialogue and every other sound path are untouched. 0 leaves the curtain
; deaf as well as blind: the thud behind it stays audible.
MutePostMovieAudio=1

; ==================================================================================================
; view_distance_fix
;
; Draw distance, fog and NPC activation range.
;
; Draw distance and fog are two numbers the engine does not connect, and the frame is cleared to
; the fog colour. Raising the range on its own costs fill rate without showing one extra pixel,
; so the two are coupled here.
; ==================================================================================================
[view_distance_fix]
Enabled=1

; 1.0 to 2.5. Two watchdogs may lower this at run time: the cell watchdog below, which does it to
; stop the draw table overflowing, and FrameBackoff, which does it when the setting is costing more
; frame time than it is worth. Anything above 2.0 needs RelocateVertexCache below, on by default.
;
; It is not free, and the cost is CPU rather than the graphics card. This engine transforms world
; geometry in software the way a 1999 title does, so a longer view is more work per frame for the
; processor and no more work at all for the card. Measured in GARDEN, the cutscene the tank drives
; out of, which is the densest thing in the game: at 2.50 that scene ran at 64-69 fps against a
; 100 fps cap, at 1.00 it held 100 flat. Nothing was overflowing and no watchdog fired; it was
; simply several times the geometry. Raise it and check the scenes you care about.
ViewRangeScale=1.0

; Let the view distance back itself off when it is costing too much frame time, and give it back
; when it is not. This is a comfort guard and has nothing to do with the cell watchdog further
; down, which guards against an overflow and always wins where the two disagree.
;
; It does NOTHING at ViewRangeScale=1.0, which is the shipped default: there is nothing below 1.0
; to back off to. It only ever matters to somebody who has raised the setting.
;
; It decides twice a second on the MEDIAN frame of the half second just finished, so a level load
; cannot move it, and the size of each step follows how far off target that window was: a 3 % miss
; only nudges, a 40 % miss moves four times as far. That is what lets it cross this setting's whole
; range in about four seconds when a scene needs it, and settle without overshooting when it does
; not.
;
; Recovery is deliberately slower than backing off: the first step back needs thirty consecutive
; healthy seconds, the rest come every ten. Walking out of a heavy scene restores the setting,
; while a scene sitting near the threshold never rings.
;
; Every change is logged with the frame time and the step that caused it.
;
; While the fog band follows the draw distance, which is the shipped default, a backoff brings the
; fog in with it; that move is eased over four seconds rather than stepping, so it reads as the
; weather closing rather than as a flicker. The developer overlay carries a switch for it directly
; under the draw distance row.
FrameBackoff=1

; Hold the draw distance at exactly ViewRangeScale and let nothing move it. 0 ships.
;
; This and FrameBackoff above contradict each other and this one wins: it declines the
; governor whatever that key says. The developer menu greys the frame-rate row while this is
; on rather than writing over it, so turning this off gives the governor back unchanged.
;
; Three things move the draw distance after you have set it. FrameBackoff above lowers it when a
; scene costs more frame time than the distance is worth. LevelOpenSeconds and CutsceneViewRange
; can each raise it, and both ship off. And the cell watchdog lowers it, permanently for the rest
; of the level, when the draw table or the vertex cache comes near overflowing. This turns off all
; four, so the number you set is the number in force on every frame.
;
; Read this before leaving it on. The watchdog is not an annoyance, it is a memory-corruption
; guard. The cell table ends exactly where the bucket list heads begin, its limit is checked once
; at the entry to the gather and not again, and an overflow was traced to an access violation in
; the draw function with a list head the renderer had read as a pointer. The vertex cache fails
; more quietly and more permanently: a vertex skipped once is never given a slot again until the
; level is reloaded, which is the stretched geometry people see after raising the distance.
;
; With this on, both of those happen instead of being avoided. The watchdog keeps running and
; keeps writing its warnings to engine_fixes.log, so a session that ends badly still says why, but
; it can no longer act.
;
; At ViewRangeScale=1.0 there is nothing to be afraid of: the shipped draw distance is what the
; game was built for and the walls are far away, more so with RelocateDrawTable on. The risk is
; entirely in holding a raised scale on a level that cannot afford it. That is a reasonable thing
; to want while looking at something, and a poor thing to leave on while playing.
;
; Read once a second while the game runs, so the developer menu's row takes effect without a
; restart. The developer menu calls it "Keep the draw distance (costs frame rate)".
StrictViewRange=0

; The frame rate below which FrameBackoff lowers the view distance. 0 works it out: 50 while
; framerate_fix follows the display, because that cap steps between fractions of the screen's rate
; by itself and there is no fixed number to take a share of; otherwise three quarters of TargetFps
; when there is a cap to miss, or 50 when the frame rate is uncapped.
;
; Three quarters rather than something dramatic because the report this was built for was a drop
; from 100 fps to 66, which is not a frame rate anybody would call broken and is exactly the kind
; of drop worth acting on. A governor that only woke at 30 fps would have slept through it.
;
; It recovers at this rate plus 15 %. The band between the two is a dead zone it settles into
; rather than crossing, so it cannot oscillate between two scales.
BackoffFps=0

; Scale each level's authored fog band with the picture, so a wider field of view brings the fog in
; with it. At the authored 60 degrees every level keeps its shipped numbers exactly.
;
; It has no effect at the shipped settings, and it is left here rather than removed because it
; does have one for somebody who changes them. FogInsideCut below ships at 2, which assigns the
; band end from the draw distance directly and so overwrites whatever this did. Set FogInsideCut to
; 0 or 1 and it starts to matter.
;
; It had a row in the developer overlay for one evening and lost it because a switch that reads ON
; and cannot change anything is worse than no switch. That is still true, and the row that remains
; beside it writes AuthoredFogBand instead, which is a different question and always has an effect.
FogFollowFov=1

; Where the fog band is allowed to end, relative to the distance the engine is actually drawing to.
; This is the setting that decides how the fog reads, and it takes three values rather than two.
;
;   0  Unbounded. The band ends wherever FogScale and FogFollowFov left it, which at the shipped
;      values is exactly where the level authored it. Two of the eleven levels then show the world
;      ending in clear air, Coruscant with no cover at its own edge at all and the Federation ship
;      with five per cent.
;
;   1  End before anything can pop in. The band is capped at the draw distance times the cosine of
;      half the picture, which is the depth of a cell sitting at the CORNER of the frustum, so a
;      cell arriving at the boundary is already hidden when it appears. The flaw is that a
;      correction computed for the corner is then applied to the whole screen, and straight ahead
;      the forward distance is the radial distance. On a 22 unit draw distance that gives an end of
;      18.2 at the authored 60 degrees, 14.3 at 94 and 10.5 at 120: a wide picture is fogged solid
;      at half the distance the engine is still drawing, and everything between is painted flat.
;      Reported from the field as a level looking washed out and as characters below a cliff being
;      drawn but invisible, and it also ties the look of the fog to the field of view slider, which
;      is a control that should only change framing.
;
;   2  End at the draw distance and no nearer. This is the shipped setting. The band end is
;      assigned from
;      the live draw distance plus a cell, so the fog reaches full opacity exactly where the world
;      stops and never inside it. There is no cosine anywhere in this rule, so the field of view
;      does not move the fog, and the assignment overwrites FogScale and FogFollowFov rather than
;      combining with them. The corner may still pop, which costs a few pixels at the edge of the
;      picture rather than half of everything in front of you.
;
; All three change the authored look, because ten of the eleven levels end their fog well behind
; their own draw distance. Under 2 that costs less than it sounds: everything past the draw edge is
; the fog colour anyway, so bringing the end to that edge hides nothing that was visible.
;
; AuthoredFogBand overrides all of this and hands back the level's own numbers untouched.
FogInsideCut=2

; How long a fog change takes, in seconds. A level load snaps instead. 0 steps immediately.
FogSettleSeconds=1.5

; 0 follows ViewRangeScale. Otherwise 1.0 to 4.0.
FogScale=0.0

; How near the fog sits, as a share of where every other setting above put it. 1.0 leaves it there.
;
; This is the only one of them that can bring the band IN. The others either keep the level's own
; numbers or push the end back out towards the edge the world stops at, because that is what hides
; the edge; none of them answers "I would like more fog than that". This one does, and it is taste
; rather than correctness, so it is applied last.
;
; It ships at 0.60. 1.0 puts the fog solid exactly where the world stops being drawn, which is the
; position the rest of this section works to compute, and that position is the safe maximum rather
; than the one that looks best: it is where the fog is guaranteed to have hidden the edge, not where
; a player would choose to put it. 1.0 shipped for a while on the argument that anything else
; overrides a computed answer with a preference. The answer it computes is a limit, so 0.60 is
; taste inside it rather than an override of it.
;
; The cost is real and it is why this is not lower. Bringing the band in means the engine is still
; drawing geometry that is behind opaque fog: at 0.5 the fog is solid at half the distance it draws
; to, so two fifths of what it renders cannot be seen, and on a level whose opening is a camera set
; well back from the player it covers the whole shot. 0.60 is milder than that on both counts and
; was picked by eye, at ViewRangeScale=1.0 with FrameBackoff=1, the settings the numbers below
; ship at. Tuning it at a stretched draw distance gives a value that will not transfer.
;
; It is the same fog on every machine. The band is world space, and the one screen-dependent term
; in it, the field of view, is already compensated for by the terms above: between a 16:10 handheld
; and a 16:9 desktop the finished band differs by under four percent, which is below noticing. So
; one number suits every resolution and there is nothing here that needs scaling per display.
;
; Both ends move together, so a level's authored proportions are kept. Lower is nearer and denser.
; Clamped to 0.25.
;
; Read once a second while the game runs, unlike most of this file, so it can be edited with the
; game up and the fog eases to the new band within a couple of seconds. No level reload and no
; restart. Picking the number is a matter of looking at it, so it is polled.
FogBandScale=0.60

; How long a level opens with the fog switched off and the draw distance raised, in seconds.
;
; 0 is the default and turns the whole thing off, both halves of it, leaving a level to start the
; way the engine starts it. Set a number of seconds to turn it on; 5 is what it was developed and
; tested at.
;
; A level load hands the engine the level's own authored band, and the coupling then recomputes the
; end from the cut edge the renderer reports once it has walked the new world. Those are not the
; same number: Mos Espa authors fog ending at 32 and its draw edge is 21.3, so the fog closes in by
; a third over the first seconds of the level. Easing makes that a slow slide rather than a jump,
; and a level whose opening is a camera set well back from the player, which is most of them, spends
; that slide with nothing else on screen to look at. Reported on the podrace.
;
; So with this switched on the fog is held off while the band settles, and faded in afterwards
; rather than snapped: it starts at twice the level's own band, where the geometry at the draw edge
; is about five per cent fogged, and the ordinary easing brings it in over FogSettleSeconds. The
; draw distance is raised over the same window because an establishing camera at the shipped scale
; is looking at ground that stops close in front of it.
;
; It ships OFF because it is the one thing here that changes what a level does rather than
; correcting it: for five seconds the game is drawing more than you asked for and showing no fog at
; all. That is a good trade if the sliding fog at a level start bothers you and a poor one if it
; does not, so it is a decision rather than a default.
LevelOpenSeconds=0

; The draw distance to hold during that window. It only ever RAISES: a player already asking for
; more keeps what they asked for. The cell watchdog can still refuse it and the frame governor can
; still take it back, exactly as with any other request, so neither guard loses its say.
LevelOpenViewRange=2.5

; Hold this draw distance while a scripted camera is running. 0 ships and turns it off.
;
; A cutscene camera is placed for the shot rather than for the player, and the draw distance is
; the player's. A camera set well back therefore looks at ground that stops in front of it. This
; raises the distance for as long as the script owns the camera and puts it back afterwards.
;
; It only ever RAISES: somebody already asking for more keeps what they asked for. The cell
; watchdog can still refuse it, exactly as with any other request, so the guard against the draw
; table overflowing is not weakened. StrictViewRange above declines it along with everything
; else that moves the distance.
;
; 0, or 1.0 to 2.5.
CutsceneViewRange=0.0

; The fog band to hold during the level opening window, in world units. Both 0 ship, which
; leaves the window using its own numbers rather than these.
;
; Only read while LevelOpenSeconds above is non zero, so with that off these do nothing at all.
; They exist because the window's own choice of band is a judgement about how a level should
; open, and somebody who wants a different one should not have to rebuild to try it.
;
; Both are clamped to 0 through 4000, and the end must be past the start or the engine paints
; the whole world in the fog colour rather than showing less of it. See FogInsideCut for why a
; negative span does that.
LevelOpenFogStart=0.0
LevelOpenFogEnd=0.0
; Which half of the engine draws the distance fog. Read once, when the game starts.
;
; 2  The device does it, per pixel. The default.
; 1  The engine's own per vertex ramp. This is what OpenPhantom shipped before.
; 0  Neither. The engine is left exactly as the device asks for it, which on modern hardware
;    means the fog is configured and never arrives. This is the unpatched behaviour and is here
;    to be compared against, not to be played with.
;
; Why 2 exists: the engine's own table fog path is not wrong, it is incomplete. It hands the
; level's band to the device in world units, and eye space w in this engine IS world units, so
; that pairing is exactly right for a device measuring fog against w. Direct3D decides between w
; and device depth by looking at the projection matrix, and the game never sets one, so the
; runtime sees the identity, calls it affine and measures depth in [0,1]. A world unit band
; against a [0,1] depth fogs nothing, so the game looks unfogged on any modern machine.
; So 2 sets a projection matrix and gives the engine its own path back, and the fog is then
; computed per pixel rather than as an 8 bit number at each vertex interpolated across polygons.
;
; 2 checks the device first and needs both table fog and w fog to be offered. If either is
; missing, or the projection is refused, it falls back to 1 and says so in the log. That gate is
; why 2 ships: a device that cannot do it is left exactly as 1 would have left it.
;
; It is not offered in the dev menu because 1 and 2 differ in device state, and this engine only programs
; the device's fog from inside one function, which runs at a level load. Changing this while a
; level is up leaves the engine and the device disagreeing about who is fogging, and nothing is
; fogged at all. Reverting the patches, handing the projection back and calling that function by
; hand were all tried in the game and none of them brought the fog back. The two band settings
; below are arithmetic and do have live switches in the menu; this one waits for a restart.
FogImplementation=2

; Use each level's fog band exactly as it was authored, ignoring every scaling term below.
;
; The terms below scale the authored band against the draw distance and the field of view so the
; fog is always solid before the geometry stops. Reading the band and the draw distance out of all
; eleven shipped level headers shows that nine of them already manage that unaided: at their own
; draw distance their authored fog is between 42 and 100 per cent opaque where the geometry ends,
; so the scaling had nothing to fix there and only brought the fog nearer than the level asked for.
; Two do not. Coruscant starts its fog exactly where it stops drawing, and the Federation ship is
; at five per cent, so both show a hard edge with this on.
;
; Raising ViewRangeScale moves the edge the world stops at further out without moving an authored
; band with it, so the higher the draw distance, the more of that edge an authored band leaves in
; clear air.
;
; OFF by default, so the band follows the draw distance and the edge is covered on every level at
; every setting. Turning it on gives each level the fog it shipped with, which is the more faithful
; picture and the one thing that makes the band incapable of moving during play. It also takes
; FogFollowFov out of use, since a band left alone is not scaled by that either. The developer
; overlay carries a switch for it, so both can be seen without restarting.
AuthoredFogBand=0

; Written by the game, NOT read by it. The draw distance actually in force, which is not always
; the ViewRangeScale above: the frame governor lowers it when a scene costs too much frame time,
; and the cell watchdog lowers it when the draw table or the vertex cache is close to overflowing.
; On a heavy level the watchdog can hold it at 1.00 for the whole level.
;
; It exists so the developer overlay can show it on the note under its draw distance row. Editing
; it does nothing; the next frame overwrites it.
EffectiveViewRange=1.00

; The least the fog end may be, as a share of the draw distance. 0 switches the floor off.
;
; This applies under FogInsideCut 0 and 1 only. Rule 2 ships, and it assigns the band end from the
; draw distance rather than capping it, so there is nothing for a floor to raise and this is
; skipped entirely. Everything below describes what it does under rule 1.
;
; FogInsideCut 1 ends the band at cos(half the field of view) times the cut edge, because a
; cell at the CORNER of the picture is only that far ahead of the eye and fog is measured on the
; forward distance. The correction is computed for the corner and applied to the whole screen,
; where straight ahead the forward distance is the full distance, so a wide picture is fogged solid
; well before the edge of what it is still drawing:
;
;   60 degrees, the authored picture   fog ends at 83 % of the draw distance
;   100 degrees                        62 %
;   120 degrees                        48 %
;
; The floor keeps the correction and refuses to spend more than this share of the visible world on
; it. Past the floor the extreme corners may show a little pop in, which costs a few pixels at the
; edge of the picture rather than everything beyond halfway.
;
; 1.0 means "bring the fog to the draw edge and no further", which the shipped levels want.
; Nine of the eleven already hide their own draw edge with the band as authored, so the correction
; had nothing to do on them and was only making the fog nearer; the two that do not, Coruscant with
; no cover at all at its edge and the Federation ship with five per cent, are covered exactly by
; pulling the band to that edge. A level whose fog already ends inside its own draw distance, such
; as the Gungan city, is left alone either way.
FogMinEndFraction=1.0

; How long a level takes to fade in from black, in seconds. 4.0 is the engine's own value and
; patches nothing. 0 finishes the fade before the first frame is drawn.
;
; The fade is a full-screen black quad whose alpha slides from opaque to clear, so for four seconds
; it multiplies the whole picture. The frame buffer is 16 bit, which gives a colour channel five
; Bits, and as the multiplier slides a large area of one flat colour crosses a quantisation
; boundary all at once and steps as a block, while lit geometry beside it steps pixel by pixel. The
; edge between the two reads as a line that flashes. The sky is exactly such an area, because the
; frame is cleared to the fog colour, so this is at its worst on a level that opens looking at open
; sky and worst of all when the camera is moving. Measured from captured frames rather than guessed
; at.
;
; The steps belong to the buffer and cannot be removed here. How long they stay on screen belongs
; to the fade. The control for that is the post-movie curtain in fmv_player, which fades an alpha
; quad out through the SAME drawing primitive into the same 16-bit buffer, quantises identically,
; and has never once been reported as flashing: it takes 300 ms rather than 4000, and the steps are
; gone before the eye settles on one.
;
; So the default here is short rather than absent. A brief fade still softens a level start and
; still covers the first moments while the fog band settles, and it crosses the whole range far
; faster than the banding can be read. It also matters more than it looks on a level people retry,
; because the curtain only covers a level that FOLLOWS A MOVIE: a save load, a retry or a death
; gets no curtain, and on those the four second fade is both the only cover and the sole cause of
; the flashing.
;
; 0 to 10. Try 4.0 for the original.
LevelFadeSeconds=0.4

; How far away an NPC is created, as a multiple of the distance the level authored. 1.0 is the
; engine's own value and patches nothing.
;
; This is the one setting here that changes how the game plays, so it ships at 1.0. The engine's
; test is a plain distance with no view direction in it, so a larger value does not widen the
; picture, it creates every actor earlier in every direction, straight ahead included. An actor
; created earlier also thinks earlier.
;
; Raise it only if you would rather hide pop-in than keep the original behaviour. Pop-in is more
; visible here than it was in 1999 because the field of view is wider, so the picture reaches
; sideways into ground the original never showed, where placements are in view before their
; authored distance is reached. 1.0 to 2.0.
NpcRangeScale=1.0

; Draw dismembered bodies two sided, at most N per frame. This softens the see through look. It
; does not close the hole, because a severed limb is not a cut mesh.
TwoSidedSevered=0
TwoSidedMax=8

; The four below are DIAGNOSTICS. They exist so a fault can be cut away from its suspects, and
; three of the four change how the game looks. None of them is a setting to play with.
;
; PolyDepthBias=0 zeroes the engine's per polygon depth bias. The fog factor is baked into a
; shared vertex by whichever polygon reached it first, so two polygons with different bias bytes
; give that vertex two different fogs depending on gather order, which changes as the camera
; moves. Zeroing it removes the difference, and also removes the depth sorting the bias exists
; for, so coplanar surfaces may fight. 1 is the engine's own behaviour and patches nothing.
;
; TranslucentFog=1 stops the engine clearing fog on an alpha blended face. It clears it
; deliberately, because table fog and alpha blending together were unreliable on 1999 hardware.
; The consequence is not old: the level of detail cross fade makes geometry translucent WHILE IT
; CROSSES, so a surface loses its fog for the length of the transition.
;
; Dither=1 asks the device to dither. Recorded here as a DEAD END rather than an option: nothing
; in this engine writes render state 26, so the idea was sound, but the Direct3D 9 translation
; layers this game runs through drop it. It was measured making no difference and is kept only
; so nobody spends an evening rediscovering that.
;
; LogFogBand=1 writes a rolling capture of the fog band and thirteen engine draw path counters
; to engine_fixes.log when the game closes. It costs a detour on the batch flush and it writes
; to disk, so it is off: nothing here writes anything while you play unless you ask.
PolyDepthBias=1
TranslucentFog=0
Dither=0
LogFogBand=0

; Writes the player's world position to engine_fixes.log while you play, and every so often the
; placements near it. 0 ships.
;
; It answers one question and it is a question about the game's own data rather than about this
; patch: where an actor was authored, so that a report of one failing to appear can be checked
; against where it was supposed to be. Nothing here changes what the game does.
;
; It writes to disk on a timer, so it is off with the rest of them.
LogPlayerPosition=0
; Move the cell table into a larger buffer, which lets its limit rise from 8192 to 32768. The
; alternative lowers the limit to 7168 instead and costs distance; it is skipped automatically
; while the relocation is active.
RelocateDrawTable=1

; Relocates the 16384 slot vertex cache to a 32768 slot buffer with a guard page, the same shape
; RelocateDrawTable gives the cell table. Twelve address-bearing operands and three capacity gates
; across three functions, all-or-nothing with rollback, and the cell watchdog's alarm threshold
; rescales to whichever buffer is actually active.
;
; This is what allows ViewRangeScale above 2.0. It does nothing on its own: at the default scale of
; 1.0 there is no extra geometry to hold, so the larger buffer simply sits there. Raise
; ViewRangeScale to see anything from it.
;
; 0 leaves the engine's own 16384 slot cache, and the log says which branch was taken.
RelocateVertexCache=1
LowerCellLimit=1

; ==================================================================================================
; dismemberment
;
; Lightsaber dismemberment: the limb the blade actually hit, and only on the killing blow.
; ==================================================================================================
[dismemberment]
; 0 off, 1 only correct which limb is severed, 2 also sever on the killing blow.
;
; This ships OFF. Severing a limb on the killing blow is a change to how the game plays rather than
; a repair of it, and anything in that class ships at the setting that leaves the game alone. It is
; a good feature and it is one you turn on, not one you discover.
;
; The developer panel's Utilities page carries a row for it, directly under No fog, and that row
; writes this key, so a choice made in game is the choice you get next time.
Mode=0

; The flight of the severed piece. The engine's own values are extreme: up to 211 degrees per
; second of tumble, and five times the world's gravity.
SpinScale=0.35
GravityScale=0.40
YawScale=0.12

; The rest state the engine does not have. After SettleSeconds the piece lies still for good;
; before that the tumble is damped by SettleDamping each step.
SettleSeconds=1.20
SettleDamping=0.80

; Measurement. Records the full state of every flying piece.
Diagnostics=0

; ==================================================================================================
; camera_handback_fix
;
; A conversation takes the camera and never gives it back, and the camera stays on that shot for
; the rest of the level. Found in Otoh Gunga, on the run up the escape route after Jar Jar joins;
; it is a fault of the 1999 game and it can happen in any level that talks.
;
; The engine keeps one flag saying a script owns the camera. While it is set, the camera update
; uses the shot that script forced instead of the region the player is standing in, and the save
; writer copies the flag into the savegame, so a save taken while it is stuck carries it out of
; the session. A spoken line that names a camera group sets that flag, which is most lines.
;
; Giving it back is where the engine goes wrong. The dialogue only releases the camera if a choice
; MENU had rows in it, and a new spoken line clears that count on its way in, so an ordinary line
; closes with it at zero and the camera is never handed back. The same test can never fire at all
; for a line that took no input lock.
;
; This releases the camera when a dialogue closes still holding one it took itself. Nobody else's
; camera is touched: a take is credited to the dialogue only while a spoken line is running, so the
; cutscene opcode, a menu, the tripod gun and the fall-death camera are all left alone, and a
; cutscene holding the input lock above the dialogue keeps its shot regardless.
;
; 0 restores the engine's own behaviour, the camera that never comes back included.
; ==================================================================================================
[camera_handback_fix]
Enabled=1

; ==================================================================================================
; dialogue_anim_fix
;
; Level 6, Mos Espa, the opening in-engine cutscene: Obi-Wan and Qui-Gon talk, and Obi-Wan's head
; keeps moving as if he were still talking during Qui-Gon's own line. His own talk animation only
; ever resets as a side effect of Obi-Wan's own next line starting, never when Qui-Gon's line takes
; over.
;
; Scoped tight on purpose, after a first version that was not: this only ever arms while the loaded
; level file is espa.b3d, only ever watches an actor whose own name starts "obinpc" or "pquigon",
; and disarms itself for the rest of the level the moment neither of them has spoken for
; HoldSeconds. No level data changes, and nothing here can act on any other actor, any other
; conversation, or any other level.
; ==================================================================================================
[dialogue_anim_fix]
Enabled=1

; How long with neither of them speaking before the fix disarms itself for the rest of the level.
; Too short and it can disarm mid-conversation, during the ordinary pause between one line and the
; next, and the original stale pose can reappear until the next line starts; too long only delays
; how promptly it lets go once the exchange is genuinely over. 0.5 to 30.0 seconds.
HoldSeconds=3.0

; ==================================================================================================
; enhanced_input
;
; Mouse look, sideways walking and free look.
;
; Strafe needs MouseLook. The engine has one turn channel, so turning the keyboard axis into
; strafing means clearing it, and without mouse look the character could not turn at all. The DLL
; enforces this and says so in the log.
; ==================================================================================================
[enhanced_input]

; Put this project's own widgets on the game's own controls screen. 0 ships.
;
; Three of them: the free look and sideways walking check boxes, and the mouse sensitivity slider.
; That screen carried none of them in 1999, so they ship OFF and it looks as it did. The developer
; menu carries a row that turns these and the field of view slider on together.
;
; Nothing is lost by leaving this off. All three are settings in this file, and the developer menu
; has a row for each, sensitivity included. This decides only whether the game's own screen offers
; them too.
;
; The sensitivity slider is gated with the other two rather than kept apart from them, and that was
; a real decision: mouse look ships on, so this is the only adjustment it has inside the game. The
; answer to that is the developer menu's own sensitivity slider, not a widget left on a screen that
; is meant to look untouched. Either the screen is the one the game shipped or it is not.
;
; Read once, while the game starts, because the screen is built by repointing the engine's own
; widget table and nothing here puts such a table back. Changing it takes effect on the next launch.
MenuWidgets=0

; The master switch for mouse look. It changes how the game plays, so a file without this key
; leaves the game as it shipped, with no mouse look at all; this file turns it on because a fresh
; install is asking for a game that can be played with a mouse.
MouseLook=1

; Degrees of view turn per mouse count.
;   0.100   4.5 inches for a full turn at 800 DPI
;   0.050   9 inches, the shipped value
;   0.030   15 inches
;   0.0225  20 inches
; The MOUSE SPEED slider on the controls screen writes this key and takes effect at once. It reads
; 1 to 100, which is this number with the decimal point moved: 0.050 shows as 50.
;
; It ships in the middle of the slider on purpose, so there is room to go either way without
; touching this file. The far end is quick enough that a small hand movement crosses the room, and
; anyone who wants the older, slower feel writes 0.030. A file without this key gets that 0.030,
; the value the mouse look was tuned at before the slider existed.
MouseDegreesPerCount=0.050

; Collect the mouse once per rendered frame and hand the whole amount to one simulation step. The
; engine polls after the steps have already run, so without this most of the hand movement is
; overwritten unread at a high frame rate. 0 restores the old per step read.
MouseAccumulate=1

; Read the mouse straight from the device (WM_INPUT) instead of through the game's DirectInput
; device.
;
; The game's own reader answers a sum of everything since it was last asked and throws the timing
; of the individual reports away. That timing is what smooth motion needs: the simulation consumes
; at a fixed 32 steps a second, so a 100 Hz mouse puts three or four whole reports into each step,
; and the difference between three and four is a third of the turn. Raw input keeps it, which is
; what removes the boundary error for free and lets the smoothing below size itself.
;
; Nothing else changes: the pointer still works in the menus and the game's device stays open. If
; raw input registers and then delivers nothing, which some remote sessions and filter drivers do,
; the game switches back by itself after two seconds and says so in the log.
MouseRawInput=1

; The MENU pointer, which is a different consumer of the same device. The engine moves it by the
; whole-pixel difference between the system pointer and a hard-coded (320,240): everything under one
; pixel is discarded rather than carried, travel is lost whenever the system pointer runs into a
; screen edge (that centre is the middle of a 640x480 screen, not of yours), and the machine's
; pointer acceleration rides along. This drives it from the device instead and keeps the remainder in
; floating point. The engine's own accumulation, its clamp and its hit testing all still run; only
; the number handed to them changes. Needs MouseRawInput=1, and it does nothing while the device
; reader is silent, because a frozen pointer would be worse than a stepping one.
MenuCursorRawInput=1

; Guard against a broken device, not against you: a single sample above this rate is cut back
; before it is used, and anything the guard holds back is delivered on the following frame rather
; than thrown away. The default is far above any hand, since a fast flick of the wrist is 1200 to
; 1800 degrees per second.
MouseSpikeLimitDegPerSec=3000

; Measurement. One line per sample the guard above had to cut. A healthy session logs nothing.
MouseLog=0

; Measurement. Degrees the camera may turn in one frame before it is worth a line in the log.
; Changes nothing, reports only. 0 switches it off.
CameraJumpWatchDeg=0

; Smoothing, and it is a ceiling on delay rather than an amount. The game measures how often your
; device reports and asks for six of its intervals, so a 1000 Hz mouse costs 6 ms and a 30 Hz
; injected pointer 200.
;
; You only need it if your pointer is not really a mouse. A remote desktop or a streaming client
; injects one that reports far more slowly than the game consumes, and the turn then arrives in
; lumps that nothing but averaging can smooth. 60 to 120 is sensible in that case. It was on by
; default once and that build was rejected in a single sitting for input lag.
;
; Leave the line commented out unless you want to decide it yourself. With no value the game picks
; per control mode, and the two want opposite answers: the classic path lets a simulation step
; consume the mouse, and a step is three times as long as a frame, so the sampling boundary hardly
; matters; NewMouseInput draws per frame, where a 125 Hz mouse puts one and a half reports into a
; frame and the boundary is most of that frame's movement. Left alone it is off for the first and
; up to 16 ms for the second. Any value here wins, including 0, which switches it off everywhere.
;MouseSmoothMaxMs=0

; How fast A and D turn the player, in degrees per second, while sideways walking is off. 120 is
; the engine's own ceiling, which is the original feel.
KeyTurnRate=120

; Let the camera follow the body directly instead of easing toward it. The engine's easing is
; ample for a keyboard, which can only turn 120 degrees per second, and far too slow for a mouse
; that can turn a quarter circle in one step. Cutscenes, scripted cameras and fixed camera regions
; keep the engine's easing regardless. 0 restores the engine's own camera behaviour.
MouseLookRigidCamera=1

; Turn the view with the mouse once per drawn frame instead of once per simulation step.
;
; The game advances your facing 32 times a second and interpolates the frames in between. A held
; turn key asks for the same amount every time, so that interpolation draws a straight line and the
; turn is smooth. The mouse does not: what your hand did between two steps differs every time, so
; several frames are drawn at one rate and then it changes, 32 times a second. That is what "the
; mouse feels stepped while the keys feel fine" is.
;
; With this on the drawn angle advances by what your hand did on that frame and the simulation gets
; the total afterwards. You still turn exactly as far; the camera shows it as it happens rather
; than up to a step later. The one visible consequence is that during a fast sweep the camera runs
; at most one step ahead of the body, where it used to run the same amount behind. Shots still
; leave along the body.
;
; Needs MouseLook=1, MouseAccumulate=1 and MouseLookRigidCamera=1, and the log names the missing
; one. No effect while FreeLook=1, which turns the camera with the mouse anyway.
;
; It measures itself: play a few seconds at 0 and again at 1, one sitting, same hand speed, and the
; log prints a line each time. Read the ratio of how much rougher the frames that ran a simulation
; step are than the frames that did not. That ratio is the stepping, and it should fall toward 1.
;
; A file without this key gets 0, the older path, so an installation that never mentioned it keeps
; the feel it was tuned with; a fresh install gets the smoother one.
NewMouseInput=1

; Measurement. Above 0, write that many consecutive lines into the log from the first fast mouse
; sweep of the session, one per drawn frame, then stop. It answers the one question an average
; cannot: whether a frame drew almost nothing and the next one drew double, the thing people mean
; by "it skips frames", or whether the sweep simply sped up. 120 covers a whole flick.
NewMouseInputDump=0

; Sideways movement is the engine's own walk or run pointed in another direction, so it has no
; speed of its own: it is the gait you are already in, with the matching animation, footsteps and
; acceleration. The check box on the controls screen writes this key.
;
; Off here, because the game shipped with tank controls and that is what its levels, its cameras
; and its jumps were laid out for. Turn it on from the controls screen if you would rather play it
; the modern way; nothing else changes with it.
Strafe=0
StrafeInvert=0

; Turn the body to face the way it travels, so a sideways walk shows the character's side rather
; than his back sliding. The camera does not follow that turn, which is the point of it.
StrafeTurnsBody=1

; How long the travel angle takes to close most of a change, in milliseconds, and the hard rate cap
; on it in degrees per second. Without the damping the angle steps between 0, 45 and 90 degrees in
; a single step and no animation blend can hide it. 0 ms restores the instant step.
StrafeSettleMs=250
StrafeTurnRate=240

; Let the camera drift around behind the direction you are travelling, instead of staying bolted
; to the way the player is facing. 0 ships.
;
; This only does anything with Strafe=1. Strafe deliberately does
; not turn the player's heading; it turns the direction the walk comes out in, so the clips, the
; footsteps and the collision stay the engine's own. The camera picks its yaw arm on whether the
; heading is changing, so while you strafe it never is, and the camera is locked to your facing.
; On a keyboard that reads as precision. On a pad it reads as the camera being asleep.
;
; With this on, the camera's own yaw offset drifts toward the angle the walk is really going in, so
; it leans round after you and settles. Let go and the target returns to zero, so it drifts back
; on its own. Nothing here writes the heading, so the walk itself is untouched: this moves the
; camera and only the camera.
;
; Switching this on switches FREE LOOK on with it. The drift aims
; the camera at the body's HEADING, and that only follows you because free look has already
; turned the body to face where it travels: behind the body and behind the direction of travel
; are then the same place. Without free look the heading never leaves where you are pointed, so
; there would be nothing to follow. The dependency is one way, and free look on its own is
; exactly what it always was.
;
; Free look owns the same cell while it is armed, so this stands aside completely whenever free
; look is on rather than the two fighting over one value.
CameraFollow=0

; How long the camera takes to close 90 per cent of the gap, in milliseconds of real time. 600
; ships, against the 250 the body's own turn uses, and the difference is the point: a camera that
; settles as fast as the body reproduces the snap this exists to replace. Lower is tighter and
; more responsive, higher is lazier and more cinematic. 0 means no damping, which is the snap.
CameraFollowSettleMs=600

; The hard ceiling on how fast the camera may swing, in degrees per second, so a sudden right
; angle cannot whip the view across. 120 ships, half the body's own 240 for the same reason the
; settle time is longer.
CameraFollowRate=120

; How long after you stop turning the camera before it starts drifting back, in milliseconds of real
; time. It exists because a pad's look stick arrives as synthesized mouse movement that lands on some
; frames and not others; without a pause the drift starts and stops several times a second, which
; reads as jitter rather than as a camera. It also gives the beat a console camera usually waits
; before it recentres. 0 removes the pause.
CameraFollowHoldMs=250

; How much of the walk's travel angle the camera actually takes, from 0 to 1, and this is the
; setting that decides whether it feels passive or feels like a fight. A held sidestep turns the
; walk a full right angle off the heading. A camera that follows all of it ends up behind the
; direction of travel, which frames the character as walking forward again and, worse, rotates the
; stick out from under your thumb: the stick is measured against the HEADING, not the camera, so
; once the view has swung round, pushing sideways no longer moves you sideways on screen. You
; correct, the correction moves the travel angle, and the view swings further.
;
; 0.35 ships: enough that the camera clearly leans with the movement, little enough that sideways
; on the stick still means sideways on screen. 1 is the full angle and is not recommended on a pad.
CameraFollowStrength=0.35

; And the hard ceiling on the result, in degrees, so a fast run of direction changes cannot stack
; up into a swing that costs you the mapping anyway. 25 ships. The strength above decides the feel;
; this is the guard rail under it.
CameraFollowMaxDeg=25

; ---- Steering a jump ---------------------------------------------------------------------------
;
; Turn the body toward the stick while you are off the ground, so a jump can be aimed after it has
; left. Off by default: it changes how the game plays rather than repairing a fault, and the jump
; puzzles were authored against a body that flies wherever it launched.
;
; The engine is already willing. Its jump update moves only the vertical, and the horizontal is the
; ordinary facing times speed with both the steer and the integrate running in the air. What stops
; it is free look's own rule that the body holds its heading outside standing, so this is
; only reachable with FreeLook=1. Under plain mouse look the view turn already steers a jump.
;
; Nothing is forced. No move bit is written and no drive is renewed, so this redirects the speed you
; launched with rather than adding to it, and a jump cannot be flown further than it would have
; gone. A scripted jump follows an authored arc and never reaches this at all.
AirControl=0

; How long the body takes to close 90 per cent of the gap to where the stick is pointing, in
; milliseconds. 400 ships, against the 150 the body uses on the ground, and the difference is the
; point: a jump that can be pivoted in place is a different game, this is meant to be a lean.
AirControlSettleMs=400

; And the ceiling on how fast it may turn in the air, in degrees per second. 180 ships, a third of
; the 540 allowed on the ground.
AirControlRate=180

; ---- The left stick ---------------------------------------------------------------------------
;
; Read the left stick from XInput as a direction and a magnitude, instead of through the game's own
; joystick path. On by default, because this repairs the pad rather than changing anybody's control
; scheme, and a machine with no pad plugged in never reaches any of it. The keyboard is untouched
; either way.
;
; What the game's own path does to a stick, and the reason this exists. It cuts a thirty per cent
; deadzone PER AXIS, so the dead region is a square and a diagonal push stays dead well past the
; point a straight push is live. It does not rescale what is left, so the first live sample arrives
; at thirty per cent rather than near zero, and the player lurches off the mark instead of easing.
; And the shipped bindings bind each half of an axis to the same control twice, which the reader
; sums, so the value doubles and then saturates at half the stick's travel. Past halfway a diagonal
; reads as a corner whichever way it is really pointing, so the direction is gone rather than
; coarse. The usable analog range is about a fifth of the stick, entered by a jump to sixty per
; cent. That is most of why a pad has always felt coarse in this game.
;
; Like every pad feature here, this needs an XINPUT controller and sees nothing else. The
; controller_input section further down explains what that means and what it excludes. Setting this
; to 0 hands the left stick back to the game's own path, faults and all, which is the right answer
; for a controller this cannot see.
;
; On a Steam Deck in desktop mode the pad is usually SILENT rather than missing, and the two look
; identical from the game. Steam holds the Deck's controls in its desktop layout there, where they
; drive mouse and keyboard rather than a gamepad, so Wine still enumerates a controller and every
; report it delivers is empty. Field measured: connected, and every stick, trigger and button read
; zero.
;
; ADD the game to Steam as a non-Steam game and launch it from Steam. That is the configuration
; confirmed working on a Deck, and it gives you the window modes and every input feature here at the
; same time. In Gaming Mode Steam does it for you, so it works there already.
;
; When a pad does nothing, read engine_fixes.log first. Three lines answer three different
; questions and they are worth telling apart: whether an XInput device was found at all, what its
; first report actually contained, and whether anything ever arrived in the fifteen seconds after
; it connected. A pad at rest and a pad sending nothing look the same for one report and not for
; fifteen seconds, so the third line waits.
PadStick=1

; Which XInput slot, 0 to 3. 0 is the first pad and is almost always right.
PadControllerIndex=0

; The radial deadzone, as a fraction of full deflection. Radial rather than per axis, so the
; boundary is a circle and feels the same in every direction. 0.24 is close to what Microsoft
; recommends for a left stick and is what this project already uses for the right one, so both
; sticks come alive at the same place. Raise it if a worn stick drifts at rest.
PadDeadzone=0.24

; How far the stick has to go before a walk becomes a run, as a fraction of full deflection.
;
; Running is a BUTTON in this engine rather than a speed: the clip selector asks whether the Run
; action is held, and picks the run clip and a speed cap of 3.5 instead of the walk clip and 2.0.
; So this answers that button from the stick. A bound Run key still works and still wins.
;
; The gait is two steps rather than a slide on purpose. The clips play at a fixed rate and nothing
; in the engine scales them by how fast the body is really moving, so a continuously variable pace
; would slide the feet along the ground, and the harder you pushed the worse it would look.
PadRunThreshold=0.70

; Half the width of the band around that threshold, so a stick resting on the boundary cannot
; flicker between the two gaits. 0 removes the band and lets it chatter.
PadRunHysteresis=0.05

; Whether the GAME may go on reading the right stick's vertical for itself. Off, and this is a
; repair.
;
; The shipped joystick bindings put that axis on the same forward and back control as the left
; stick's, and the engine sums every binding on a control, so pushing the right stick up walked
; the player while the left stick was the one steering. On a pad that is the stick you aim
; with, so it reads as the game being broken. Measured rather than guessed: with the patch's
; own synthesised vertical already off, JOYENABLE=0 stopped the walking.
;
; The game's own reading is answered with a zero for that one axis. Every other axis, the
; buttons, the hat and the keyboard are untouched, and nothing is unbound: the binding is still
; there and the Controls screen still lists it.
;
; It costs one thing. The joystick binding screen finds out what you are moving by reading these
; same axes, so while this is 0, pushing the right stick up or down on that screen registers as
; nothing and you cannot give that axis a new binding.
;
; 1 hands the axis back, for somebody who wants to bind the right stick vertical on purpose.
PadEngineRightStick=0

; Lean the upper body into a turn. The engine twists chest and head from its own turn rate, which
; mouse look has to clear, so the twist was being computed from a number that no longer meant
; anything. This reissues both writes with the engine's own value. Mouse look only: under free look
; that same cell carries the mouse, and there the mouse is the camera.
SteerLean=1

; Let that lean follow your hand instead of the engine's turn cell.
;
; Only one thing in the game ever lowers that cell: an outright store of zero, taken whenever the
; mouse axis reads nothing on a step. The axis is refilled once per drawn frame, so a frame that
; carried no report from the mouse makes the next step read "the hand stopped", and the shoulders
; and head snap back to centre and climb out again, many times a second. The faster the game draws
; the more often it happens, so it shows here and did not on a 1999 machine. This uses
; the same hand speed the view is already turned by, which is smooth by construction.
;
; A held turn key is untouched. There the engine's own climb to full rate IS the lean, and it is
; used exactly as before. Needs SteerLean=1 and MouseLook=1.
SteerLeanFromHand=1

; Hand the engine back its turn rate instead of a zero. Nine other places read that cell as how
; hard the player is turning, and the speed penalty on turning is the one you feel. It does not
; reach the follow camera, which overwrites that cell with its own number before it looks at it.
RestoreTurnRate=1

; Measurement. Above 0, print that many steps in which you were actually steering, then stop. Each
; line names which control scheme took the step, the stick, the angles, the speed delta being
; written, and what the upper body twist did. It also names the three gates that decide whether the
; walk is ours or the engine's, which no number in the line would otherwise show.
; 150 is about five seconds of movement: walk, turn, push the stick each way, and hold fire.
SteerLog=0

; Measurement. Non zero forces chest and head to this fixed angle, ignoring the turn and the
; damping. It answers one question: does a rotation of the upper body reach the screen at all.
; Try 45, then set it back to 0.
SteerLeanTestDegrees=0

; ---- free look -----------------------------------------------------------------------------------
; The second control scheme, mutually exclusive with the one above. The mouse turns the camera and
; no longer turns the body; the body turns toward whichever direction you ask to travel, measured
; from the camera. Needs MouseLook=1. Horizontal only: the pitch is not touched.
;
; Two things change. Holding back is a half turn and a walk toward the camera, so the backward
; animation is retired, and walking into one of the game's fixed camera regions is noticed one
; frame late. The check box on the controls screen writes this key and takes effect at once.
FreeLook=0

; How long the body takes to close most of a turn toward your direction of travel, in milliseconds,
; and the hard rate cap on that turn. The engine's own 120 degrees per second needs three quarters
; of a second for a right angle, which is far too slow once the camera has been flicked. 0 snaps.
FreeLookBodyTurnMs=150
FreeLookBodyTurnMaxDegPerSec=540

; These next two decide who aims while the trigger is held, and they DEFAULT FROM Strafe rather
; than to a fixed value, so both are commented out here. Leave them that way unless you
; want to override the pairing.
;
; With Strafe=0 they default ON. The body turns to face the camera for a moment while an attack is
; live, so the shot follows where you are looking rather than where your feet point, and your keys
; keep steering the walk underneath it. That is the right answer when the body would otherwise face
; wherever it walks and you have no other way to aim.
;
; With Strafe=1 they default OFF, because you have already chosen the other scheme: the body faces
; where it travels and the movement keys point it, so squaring it up to the camera the moment you
; shoot takes the aiming away from the control you are already using. The camera follow is caught by
; the same thing, since it stands off while the body is held at the camera and so appears to stop
; working exactly while you shoot.
;
; Set either explicitly to override the pairing. They are read once at startup, so switching Strafe
; during a session does not move them underneath you.
;FreeLookAimSnap=1
;FreeLookAimKeepsMovement=1

; How far the upper body may be twisted away from the feet, in degrees. The same number aims the
; shot and turns the chest, so a shot never leaves along a line the weapon is not on. 90 lets you
; strafe sideways and shoot along the strafe. Lower it for a stiffer pose and a shorter aim.
FreeLookAimTwistMax=90

; How far a full sideways key swings your aim while the fire button is held, in degrees. The mouse
; is still the aiming device: this rides on top of the body already being squared up to the camera,
; so you can lead a target sideways without moving the camera to do it. The same number aims the
; shot and turns the chest, so the pose follows the aim. It is spent inside FreeLookAimTwistMax
; above rather than on top of it, so raising this alone cannot point the weapon further off the
; body than that allows. 0 switches it off and leaves the mouse alone with the job.
FreeLookAimStrafeSwing=45

; Walking over a floor that belongs to a fixed camera region hands the camera to the engine, which
; swings it toward that region's authored angle. Up to this many degrees of that swing are taken
; back when the region lets go; past it the swing is treated as a real re aim and kept. This is
; what "the camera sometimes turns on its own while walking" was. 0 switches it off. A cutscene
; never recovers, because it places its shot on purpose.
FreeLookRegionRecoverDeg=25

; Measurement. One line per change of free look's arming gate, never one per frame, capped at 400 a
; session. Switch it on only when chasing a camera that turns on its own.
FreeLookLog=0

; ==================================================================================================
; imuse_fix
;
; Music that pauses when you Alt Tab, and a music thread that cannot lock itself up.
; ==================================================================================================
[imuse_fix]
Enabled=1

; The audio options screen switches the 3-D provider by silencing the music, detaching, opening the
; new provider and re-attaching. The re-attach reloads MVOL from obi.ini, and the screen does not
; write MVOL until it closes, so a music slider moved before the switch was thrown away and a
; switch made while music was already detached wrote MVOL=0. 1 remembers what the slider had and
; puts it back after the re-attach. 0 leaves the engine's own behaviour alone.
MusicVolumeAcrossProvider=1

; Pause the music while another application is in front and resume it on the way back. The engine
; never does: its window procedure routes the focus message to two functions and both are about the
; mouse pointer. Only music the game is actually playing is paused.
PauseMusicOnFocusLoss=1

; Resume a pause that nobody owns. Fires only while the game is in front, the pause menu is not up,
; and this DLL is not the one that paused. It never pauses anything.
ResumeOrphanedPause=1

; How many consecutive frames an ownerless pause has to persist first. 12 to 6000.
OrphanGraceFrames=120

; Measurement. One line per change of the music state, capped at 400 a session.
MusicLog=0

; Measurement. Reads two cells in the music DLL once per frame and writes nothing: how many
; heartbeats have run, and whether the lock is held. A stall then shows as two numbers.
MusicProbe=0

; Seconds between routine "still alive" lines. 0 says nothing unless the heartbeat stalls.
MusicProbeSeconds=10

; Measurement. Copies the music DLL's own running commentary into the log: the sequence it is
; switching to, the file it is opening, the script errors it refuses. Makes the log large.
MusicTrace=0

; The repair. The music does not stream on the game's thread: a multimedia timer refills the buffer
; about 50 times a second, and that buffer loops, so a stopped refill does not fall silent, it
; circles its last fragment forever. The refill is gated on a counter both threads change without
; interlocked instructions, and a lost decrement can only ever leave it stuck held.
;
; This makes both sides of that counter atomic, and refuses the five parameter ranges whose refusal
; inside the music DLL keeps the lock forever. One such call is enough to end the music for the
; session. Three writes into the mapped DLL at run time; the file on disk is never touched. The
; first two are a pair, the atomic raise and the atomic lower: if the second cannot be installed
; the first is rolled back, and if the rollback is refused as well the log says the lock is raised
; atomically and lowered as it shipped for the session. The third, the guard in front of the
; parameter call, stands alone: if it cannot be installed the atomic pair stays and the parameter
; leak stays open, with the watchdog below as the only net for it.
MusicLockFix=1

; The net behind it, and it only ever releases. If no refill has run for this many milliseconds
; while the timer is still firing and the lock is held, the lock is written back to zero. It cannot
; underflow, because the engine's own release tests for zero before it decrements.
;
; A file without this key gets 0. The watchdog writes into the music DLL's own lock, and a file
; that predates it is not given a writer it never asked for; a fresh install gets the net.
MusicHeartbeatWatchdog=1
MusicHeartbeatWatchdogMs=400

; Reproduction tool, not a feature. Drives music changes this many times a second to provoke the
; stall on purpose. The music will stutter and cut while this is on. 0 is off.
MusicStressHz=0

; ==================================================================================================
; crash_report
;
; On a crash, writes the exception code, address, module, registers and the engine frames from the
; stack. Changes nothing about how the crash unfolds, and costs nothing until one happens.
; ==================================================================================================
[crash_report]
Enabled=1

; ==================================================================================================
; crt_copy_fix
;
; An inlined copy loop in the original reads four bytes before its source, in 40 places. Invisible
; on the heap, fatal on a locked surface whose preceding page is not mapped.
; ==================================================================================================
[crt_copy_fix]
Enabled=1

; ==================================================================================================
; decal_fix
;
; Ground shadows, scorch marks and footprints, which a Direct3D 9 translation layer drops.
;
; A decal is the ground polygon itself, drawn again at exactly the same depth. The only thing that
; normally lets it win the depth test is a render state Direct3D 9 removed, so the engine asks for
; something the device cannot give it and the decal loses. The fix is to stop asking.
; ==================================================================================================
[decal_fix]
Enabled=1

; The repair itself: stop the decal branch asking for the depth bias the device cannot give it.
; Leave this on. With it off the DLL installs and does nothing.
NeutraliseZBias=1

; Optional extra push toward the camera, in device depth. 0 is correct, because the engine relies
; on its decal sitting at exactly the ground polygon's depth and relaxes the depth compare for it.
; This was the first theory about the defect and it is not the fix. Raise it only if your
; translation layer cannot reproduce an exact float equality; above 0.01 it is clamped.
DepthBias=0.0

; Instruments, both off. They clear and set bits in the decal's render state word before it
; reaches the device, so a suspect bit can be tested in one run instead of one rebuild each. The
; word asks for at least two things Direct3D 9 removed, and a translation layer may honour, drop
; or mistranslate either. At 0 the word reaches the engine exactly as it left it.
StateClear=0
StateSet=0

; ==================================================================================================
; controller_input
;
; The right stick looks around, Start pauses, the triggers roll. Nothing else about a controller
; is touched.
;
; This needs an XINPUT controller. That is a requirement, not a preference: it reads the pad with
; XInputGetState and reads nothing else. An Xbox pad works as it is. Anything else has
; to be presented as one, and there are two ways to do that:
;
;   Add the game to Steam as a non-Steam game and launch it from there. Steam Input then presents
;   almost any controller as an XInput device, including a Steam Deck's own controls. This is the
;   one that has been confirmed end to end, on a Steam Deck in desktop mode, where launching from
;   Steam gives you the window modes and every input feature here together.
;
;   Or run something that emulates XInput, such as DS4Windows for a PlayStation pad.
;
; Without one of those, a DirectInput-only device is invisible here: an older or off-brand
; controller, a PlayStation pad plugged straight in, a flight stick. Nothing this DLL does will
; reach it, and the log says so rather than staying silent about it. The game's own Controls screen
; still reads such a pad, with the shipped joystick faults the enhanced_input section describes.
;
; A DirectInput pad is not out of luck: the game has its own joystick support and its own Controls
; screen, and that path still works exactly as it shipped. What it does not get is the three things
; below, and it keeps the shipped joystick handling's own faults, which are real and are described
; in the enhanced_input section above.
;
; Reading a wider set of controllers directly is wanted and is not written yet. It is a bigger piece
; of work than it sounds, because the reason this reads XInput is that XInput answers one question
; with one call, and every other device interface makes the caller do the deadzone, the axis mapping
; and the button naming itself, which is the part the engine's own joystick path already gets wrong.
;
; Built after a field investigation traced a reproducible, large single-frame stall to
; Xidi, a third-party controller wrapper this project used to install (and no longer does), being
; actively polled, on more than one machine and more than one way of exposing the controller to
; the game. This reads the pad directly with XInputGetState and synthesises the same mouse/keyboard
; input Xidi's own working configuration for this game already did for look and pause; roll holds
; down the game's own Alt+arrow binding, read directly off its own Controls screen. No wrapper DLL
; and no dependency on the game's own joystick reading at all.
;
; On by default: played and confirmed working across several sessions, look, pause and roll all
; feeling exactly like keyboard and mouse. If your controller is also bound in the game's own
; controls screen, leave it unbound there, so the two are not both trying to answer the same stick
; and button.
; ==================================================================================================
[controller_input]
Enabled=1

; The camera. 0 leaves the right stick doing nothing.
LookEnabled=1

; The right stick's vertical axis. Off, and this is not an oversight: this game's camera does
; not pitch, so a vertical movement is not a look anywhere and nothing is waiting for one.
; Left and right are unaffected either way.
;
; 1 sends it anyway. Two things do read a vertical mouse movement: the menu pointer, and
; dev_overlay's free camera, which is the one place here with a vertical look.
LookVertical=0

; Start opens the pause menu. 0 leaves Start doing nothing.
PauseEnabled=1

; The left and right triggers drive the game's own Left Alt+Left arrow / Right Alt+Right arrow
; roll binding, read directly off the game's own Controls screen rather than assumed. Alt is held
; and the arrow key is tapped: once on crossing the threshold, then every 150 ms, each tap held
; 50 ms. Holding the arrow down was tried first and the roll stalled after one turn. 0 leaves both
; triggers doing nothing.
RollEnabled=1

; Which XInput slot to read, 0 to 3.
ControllerIndex=0

; Radial deadzone on the right stick, 0 to just under 1. Applied to the stick's whole deflection
; rather than per axis, so a small diagonal push cannot sneak past it on both axes at once.
Deadzone=0.24

; Synthesised mouse counts per second at full stick deflection, in the same units enhanced_input's
; own MouseDegreesPerCount scales from (this DLL does not read that setting, there is no run time
; dependency between the two). At that feature's own default, 0.050 degrees per count, this turns
; at 200 degrees per second at full deflection. Accepted range 1 to 100000; anything outside it,
; including a value that is not a number at all, is refused with a warning and the default used.
; To turn the right stick off entirely use LookEnabled=0 rather than a zero here, which also stops
; the poll doing the work.
LookSensitivity=4000.0

; How far a trigger has to travel, 0 to 255, before roll engages. 30 matches Microsoft's own
; XINPUT_GAMEPAD_TRIGGER_THRESHOLD, low enough not to require a hard pull, high enough that a
; trigger at rest, which is not perfectly zero on real hardware, does not chatter the roll keys.
TriggerThreshold=30

; ==================================================================================================
; sfx_volume_save_fix
;
; The SFX volume slider came back at (about) full on every reload, whatever it was set to.
;
; Two separate bugs in the 1999 code. The value written to obi.ini's SVOL came from asking the
; sound driver rather than reading the engine's own copy of what it had last set. And the value
; loaded back at startup was applied one statement before the engine marked sound as ready, while
; the function that applies it does nothing at all until that flag is up, so the load was a silent
; no-op on every launch. Both are repaired without editing the engine's instruction order.
;
; A slider notch is not the test: the menu's own arithmetic truncates in both directions, so notch
; 5 saves as SVOL=33 and 33 seeds back as notch 4. Check SVOL= in obi.ini, not the slider.
; ==================================================================================================
[sfx_volume_save_fix]
Enabled=1

; ==================================================================================================
; diagnostics
;
; Observation only. Every hook calls the original and changes nothing, and with Enabled=0 this DLL
; does not touch one byte of the image. The stream goes to engine_fixes_diag.log.
;
; Levels: 0 off, 1 events, 2 also the detailed traffic.
; ==================================================================================================
[diagnostics]
Enabled=0

Audio=0
Music=0
Trigger=0
Fsm=0
Level=0
Player=0
Dialogue=0

; Fx has a third level. 2 reports every decal stamped into the pool, 3 also reports every decal
; drawn and which of the drawer's two silent exits swallowed it. A decal that is stamped is not a
; decal that is drawn. Level 3 is loud: one line per decorated polygon per frame.
Fx=0

; Count the NPC spawns the engine refuses. When an actor should be created the engine takes a
; record out of two pools that are fixed at start-up, 128 actors and 255 things, and a full pool
; makes the spawn return zero without writing anything anywhere. The placement is skipped and the
; enemy is simply not there. Switch this on before asking anybody to reproduce a missing enemy.
;
; This one is read by view_distance_fix, which owns the site, not by the diagnostics DLL. It sits
; here because this is where measurements live, and it works whether or not Enabled above is set.
Spawns=0

; Count the engine's own generic ballistic-physics list (blaster bolts confirmed, debris/sparks
; share it) every 30 frames, and past 10 live entries also name the first few by position, so a
; pileup reads as stacked or spread at a glance. This is the census that measured the projectile
; pileups this census was built to investigate. Read only; nothing on the list is ever touched.
Projectiles=0

; Report every time a script takes the camera away from the player and every time one gives
; it back, naming the caller that asked and keeping a running depth.
;
; The engine keeps one flag saying a script owns the camera, and while it is set the camera
; uses the region that script forced instead of the region the player is standing in. Seven
; places set that flag and six clear it, and they are not paired one to one, so a take that
; is never released is possible: the camera then stays on a shot the player walked away from
; until the level is reloaded, because nothing else clears it.
;
; A depth that stays above zero while the player has control is that fault. Read only.
;
; This is the measurement that found the fault camera_handback_fix repairs. The two run
; together: they detour the same three camera functions, each declares them as detour targets
; so the second to load finds a prologue the first has already replaced, and the one too short
; to anchor on once detoured is found behind its neighbour.
CameraOwner=0

; Name the characters standing near the player, every 60 frames: what the engine calls each one,
; where it is, its state and AI mode, and how much height it gained or lost since the previous
; report. Built to answer two questions a field report cannot. Which record is the
; character I just walked up to, and is a character that appears to sink through the floor being
; shoved down in steps or falling.
;
; The name is an archetype label the placement supplies and is reused across placements, so it is
; the name together with the position that identifies one character rather than the name alone.
;
; 1 reports the characters within CharactersRadius of the player, 2 reports every live character in
; the level and ignores the radius. Read only: the pool's slot array is walked directly rather than
; through the engine's own iterator, which keeps its cursor inside the list header.
Characters=0

; World units around the player that Characters=1 reports. Ignored when Characters=2. A value below
; 1 is treated as the default rather than reporting nothing.
CharactersRadius=12

; The name of one character, exactly as Characters above reports it. When set, a hardware data
; breakpoint is placed on that character's height the first time the census sees it, and every
; instruction that writes it is logged by address. This is the instrument that answers "what is
; moving this character" without inferring it from the disassembly.
;
; It watches an address, not an object, so it is disarmed automatically when the level changes.
; Do not run it under a debugger and believe the result: a debugger owns the same four registers
; and will quietly take them back. Needs Characters above to be on, since the census is what finds
; the character and arms the watch.
;
; Empty watches nothing, which is the default.
CharacterWatch=

; Arm that same write watch on the player's DRAWN body instead of on a character. The body is a
; different object from the record that owns it, and on a level whose player phases never run
; nothing copies one onto the other, so a body can descend visibly while the record it belongs to
; never moves. Only one watch exists, so this and CharacterWatch are alternatives. Needs Characters
; above to be on: the observer declines without it, and so does the DLL if nothing else is on.
;
; 1 watches the body position height, the only thing this key has ever meant.
;
; 2 watches the PREVIOUS position instead, on X. The drawn object carries a previous position
; beside its current one and the engine interpolates between the two, and that interpolation is
; how a character moves smoothly between simulation steps. On a platform that pair is identical on every
; frame, so nothing is interpolated and the rider steps 32 times a second while the platform under
; it is drawn every frame; walking, the pair differs and the interpolation works. This names
; whatever flattens it. X rather than Z because a platform travelling horizontally never changes
; the height, so a watch on the height would never fire.
PlayerBodyWatch=0

; Which four bytes of that character the watch is armed on. 0 watches its position height, which
; names whatever moves it. 1 watches its velocity height instead, which names whatever pushes it.
; Position answers "what moved this", velocity answers "what decided it should move".
CharacterWatchVelocity=0

; Above 0, list the occupied sound channels every N milliseconds. Minimum 100.
AudioCensusMilliseconds=0

; Flood protection, in lines per second. 0 is unlimited. Repeated identical lines are always
; collapsed and counted regardless.
MaxLinesPerSecond=60

; Mirror every diagnostic line into engine_fixes.log as well.
AlsoToMainLog=0

; Why the PICTURE stutters, which is a different question from what the game is doing. The only
; observer here that watches the machine rather than the engine.
;
; 1  one line a second: frames drawn, median and worst frame time, hitches, process and machine CPU
;    load, page faults a second, working set, graphics load.
; 2  plus the frames on either side of every hitch. An average over a second cannot show a single
;    late frame, and a single late frame is what the complaint is about.
;
; A hitch is measured against the session's own median rather than a fixed number of milliseconds,
; because the same build runs at 30 frames a second and at 300. Beside each frame stands what the
; engine believed that interval was, so a disagreement shows the world advancing by one number
; while the picture stood still for another. It installs no hook and samples on its own thread, so
; it cannot become a cause of what it is looking for.
Frame=0

; How far past the median counts as a hitch, in per cent. 0 uses the default of 60, which at 90
; frames a second is about half a frame late.
FrameHitchPercent=0

; The Windows performance counter the graphics load is read from. Counter names are localised, so
; on a non English Windows the default will not resolve and the log says so. Put the local name
; here; everything else in the line works without it.
FrameGpuCounter=\GPU Engine(*engtype_3D)\Utilization Percentage

; Which of the engine's two presentation paths this installation uses. The engine chooses per
; display device between a GDI BitBlt into the window and a DirectDraw flip, and that decides what
; can be done about presentation at all: a DirectDraw wrapper owns the flip and its settings reach
; it, while the BitBlt goes past any wrapper straight into the window. A third answer exists,
; DirectDraw with no back buffer, on which the engine's present succeeds without presenting.
;
; One line, not a stream, read at the first frame with the display open and printed again only if
; it changes. Level 2 adds the addresses it resolved.
Present=0

; ==================================================================================================
; render_guard
;
; Two unbounded writes in one engine function. The deferred face path keeps a 32 byte outcode array
; on its own stack frame and writes one entry per vertex without checking the count, so the 33rd
; vertex of a face lands on the saved return address; and the vertex pool cursor is advanced with no
; ceiling at all. Neither is reachable by the artwork the game ships, so the engine has
; run for a quarter of a century with them, and both are reachable by replacement artwork.
;
; The third setting is a repair rather than a guard. The mapper that turns the device's depth
; comparison capabilities into a Direct3D compare function can answer 0, which Direct3D does not
; define. Only the LESS capability produces it, so 0 becomes LESS and every other answer passes
; through untouched.
; ==================================================================================================
[render_guard]
Enabled=1

; The most vertices one deferred face may carry. The engine's own array holds 32 and its 33rd entry
; is the return address, so 30 leaves two spare. A face past this is refused the same way the
; engine refuses one when its queue is full, which is a path the engine already handles.
MaxDeferredVertices=30

; The ceiling on the shared vertex pool. Read from the engine's own queue limit at install where
; that can be resolved; this value is the fallback and the plausibility bound on it.
PoolCapacityVertices=8196

; Turn an undefined depth comparison answer into LESS. 0 disables only that repair and leaves both
; bounds above in place.
GuardDepthCompare=1

; ==================================================================================================
; effect_clock
;
; Three effects re-roll their random numbers once per RENDERED frame. In 1999 that was once every
; thirty-third of a second and it read as an authored flicker. At 240 frames a second the same code
; re-rolls eight times as often, and lightning, flicker and halo all turn into noise that averages
; into a steady blur. None of them has any geometry state, so there is nothing to interpolate; the
; repair is to put them back on the rate they were authored for.
;
; One side effect: the drawing path no longer advances the engine's global random
; generator, so the simulation's own sequence stops depending on how many frames were drawn. The
; original was already frame rate dependent there.
; ==================================================================================================
[effect_clock]
Enabled=1

; The lightning. Off leaves the arcs re-rolling once per rendered frame.
PaceLightning=1

; How many simulation steps one bolt shape survives. 1 is the authored rate. Larger numbers hold a
; shape longer, which reads as slower lightning rather than as smoother lightning.
SubstepsPerRoll=1

; An object carrying the flicker flag is skipped entirely, animation included, when a draw lands
; under a fifth. That draw happened once per rendered frame, so above 32 frames a second the object
; flickered faster the better the machine was.
PaceFlicker=1

; A halo's brightness gets up to four tenths added at random and is then clamped, once per object
; per rendered frame, so it twinkles at the authored rate and averages into a steady blur above it.
PaceHalo=1

; ==================================================================================================
; large_textures
;
; Not a fix. The largest page in the original artwork is 64 pixels on a side, so on the game as it
; shipped this is the identity. It exists so replacement textures can be larger than 1999 hardware
; allowed.
;
; The engine clamps every texture page to 256 pixels per axis and crops what is larger: a 512 wide
; page is created at 256 and only its leftmost columns are copied. One immediate governs both axes.
;
; The engine never asks the device for its own maximum, so an impossible ceiling here shows up only
; as surface creation failing, which degrades to untextured through the engine's own failure path.
; ==================================================================================================
[large_textures]
Enabled=1

; Pixels per axis. 256 is the engine's own value and means change nothing. Range 256 to 8192,
; powers of two only.
MaxTextureSize=1024

; The world geometry pages are a separate ceiling and are left at the engine's own 256 by default,
; because raising that one costs video memory on every level whether the artwork uses it or not.
MaxWorldPageSize=256

; ==================================================================================================
; dev_overlay
;
; A panel over the running game, opened with F6 or the key below Escape. It holds the cheats today
; and is named for what it is rather than for what is in it, because diagnostics and developer
; tools will be groups inside the same panel and a shipped DLL cannot be renamed without breaking
; your ini.
;
; It is drawn with the game's own renderer, into the frame the game has already built, so there is
; no second window, nothing can steal the focus and it works in full screen. While it is open the
; player is held still the way the game holds it during a cutscene, the mouse pointer is the game's
; own, and Alt+F4 and Alt+Tab still work.
;
; Two tabs. Original holds the eleven codes the shipped game already understands, switched exactly
; the way its own console switches them, and the sixteen it runs once. OpenPhantom holds the cheats
; this project adds, the settings of this patch, the window mode and the frame rate. Everything
; starts folded; type in the search box to find something by name.
; ==================================================================================================
[dev_overlay]
Enabled=1

; Which key opens the panel, as a Windows virtual key code in decimal.
;
; 0 is the default and accepts three keys: F6, and the key directly below Escape, which is the
; backtick on a British or American layout and the caret on a German one. That last key has been
; the way in since this panel existed and is kept, but by itself it cannot cover a layout where the
; key below Escape is neither of those, and there are several. F6 is in the same place on every
; keyboard, and the retail game binds nothing to it. F5 would have been the obvious choice and is
; taken: the game reads it as a player action, and since the game reads keys as DirectInput
; scancodes while this reads window messages, a shared key would do both things rather than one.
;
; Any other number binds exactly that one key. The panel's own "Key that opens this menu" row
; writes this, so it is easier to press the key you want than to look its number up.
;
; A NAME works too, and is easier to type than a number: F8, numpad +, backtick, caret, A, Home,
; Insert, Space. Case, spaces and underscores are ignored, so "numpad +" and "NUMPAD_PLUS" are the
; same thing. Anything this does not recognise is reported in the log and the default is used, so a
; mistake here cannot leave you with no way in.
;
; A number is still a Windows virtual key code, as this setting has always taken. That is
; also the way to reach a key with no name above, including the number row: 53 is the 5 key. Some
; common ones: 112 to 123 are F1 to F12, 192 is the backtick, 220 is the caret.
;
; Editing the file is for when you cannot open the panel at all.
OpenKey=0

; Where a line of text sits relative to the position it is given. The font layer has three modes.
; 0 centres a line on its position, which was established by trying it. 1 and 2 are the other two,
; and the game's own frame rate readout draws at the left edge under mode 1, so 1 is the
; default here.
;
; If the panel's text ends at the wrong edge instead of starting where it should, try 2.
TextAlign=1

; How much bigger than its authored size to draw the dev menu. 1.0 is the size the game's own
; menus are read at.
;
; The menu is a fixed number of pixels, so it reads the same on a 1080 display and a 4K one. What
; that cannot know is how big those pixels physically are: on a laptop running a high density panel
; the same overlay that is comfortable on a desktop monitor comes out tiny. The engine has the
; resolution and not the screen, so raise this if the text is too small to read and lower it if the
; menu takes up too much of the picture. Clamped to 0.33 and 4.0.
;
; The "Dev menu size" row at the bottom of the menu's own OpenPhantom tab writes this key, so it
; can be set while the game is running and seen as it changes, which is easier than guessing a
; number here and restarting to find out what it looks like.
;
; 0 means "size it from my resolution", and is the shipped setting. The panel is a fixed number of
; pixels, so on one monitor doubling the resolution halves how big it looks. At 0 it holds the size
; it reads at on a 1080 screen: 1.0x at 1080 and below, about 1.33x at 1440, 2.0x at 2160. It never
; goes below 1.0x, because a screen with fewer pixels is usually a physically smaller one.
;
; Resolution cannot tell a 27 inch 4K monitor from a 13 inch 4K laptop, so this is a sensible
; middle rather than a right answer. The explicit setting below is still there for that.
;
; Any other number is an explicit multiple of the authored size and overrides that. It is still
; capped at what fits on your screen, because a panel larger than the display takes the row that
; would set it back off the edge with it, and then the setting cannot be undone from inside the
; game. A larger number is accepted and quietly reduced, and the row shows what was allowed.
;
; The row in the panel reads "auto 2.25x" while it is deciding for itself, so it says both what
; mode it is in and how big that currently is. Typing that back, or typing 0, asks for automatic
; again.
DevMenuSize=0

; Start the game with fog switched off, the way the panel's own "No fog" row leaves it.
;
; That row writes this key every time it is flipped, so the setting is a record of the last choice
; rather than something to be edited here, and the row can still be flipped as often as you like
; while the game runs. Fog is a matter of taste rather than an advantage, so this one
; cheat is remembered between runs and the rest of the panel is not: a cheat left on by accident
; should not follow you into a fresh game.
;
; The band is pushed out past anything drawn rather than the fog being disarmed, so the picture
; keeps the colour it had and only the fog stops arriving.
NoFog=0

; ============================================================================================
[ground_clip_fix]
; Stops a character being pushed down through the floor it is standing on.
;
; The engine does not collision test every character: the movement function jumps past the whole
; collision block for some of them, committing the move unconditionally. That is sound while those
; characters never move. Contact breaks it, adding an impulse to such a character without anything
; able to stop the result, so it travels through whatever it is sitting on and keeps the lower
; position each time.
;
; This hooks the contact handler and takes that push back off a character nothing will collision
; test, restoring the velocity it held before the contact rather than zeroing it.
;
; Being exempt from collision does not mean a character is static: ships, birds and the droids on
; flying platforms are exempt precisely because they fly. Their own velocity is unchanged by the
; contact handler, so it is never touched and they keep moving. Only a velocity the handler itself
; changed is treated as a push.
;
; 0 leaves the engine's own behaviour, and the log says which branch was taken.
Enabled=1

; Stop a CRUSHER taking characters down with it.
;
; A crusher exists to kill by crushing, not to carry passengers, and in the final level's opening
; one of them has a collision polygon sitting at floor height. The floor probe selects it as the
; surface two characters are standing on, so running it draws them five centimetres down through
; the floor that is actually drawn there, where they stay until the cutscene ends. It is a fault
; of the 1999 game: it happens with every one of these mods switched off, and it is the same at 30
; frames a second as at 100.
;
; Two routes take them down and both are guarded, because either one alone is enough to do it. The
; rider carry moves them with the mover, and the ground snap then pulls them onto any floor within
; a third of a unit below their feet, which is the crusher's own polygon. Both guards follow a
; shape the engine already uses: it refuses to carry riders for latched one-shot movers, and it
; already exempts corpses and anything that flies or swims from the ground snap.
;
; The mover's type is not the test. Decoding the shipped levels found about sixty four crushers,
; fifteen of them with walkable faces that descend, and several are plainly transport, including
; an articulated ninety unit lift. What separates the broken one is its RATE: it creeps down at
; 0.0008 of a unit a tick where the slowest genuine platform manages 0.032, a factor of forty with
; nothing in between. So only a crusher descending slower than a fiftieth of a unit a tick is
; refused, which is transporting nobody anywhere; every real platform is untouched, and one moving
; upward is left alone regardless.
;
; 0 restores the engine's own behaviour, descent included.
CrusherCarry=1

; ============================================================================================
[sound_lifetime_fix]
; A pinned voice must not keep the address of a local belonging to a function that has returned.
;
; When a sound starts, the engine remembers where the caller keeps its channel handle, and writes
; -1 back through that address when the voice ends so the owner learns the sound is over. Three
; call sites in the projectile code hand it the address of a temporary instead, then pin the
; channel. Pinning exists to detach a voice from its caller and it does half the job: it copies the
; position by value and leaves the handle pointer alone. Every blaster shot therefore leaves a
; voice holding an address that stops meaning anything the moment the shot function returns.
;
; Loading a save stops all twelve voices at once, so every one of those addresses is written to at
; the same moment, in the middle of the load. Saving with blaster bolts in flight and then loading
; that save crashes the game, and turning sound effects off is what stops it.
;
; This clears the handle when the voice is pinned. Only a handle pointing into the stack of the
; calling thread is cleared, so a voice whose owner lives anywhere else keeps the behaviour it had.
;
; 0 leaves the engine as it shipped, and the log says which branch was taken.
Enabled=1
