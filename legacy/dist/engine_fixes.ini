; Engine fixes, one section per DLL.
;
; This file belongs next to WMAIN.EXE, together with dinput.dll. The feature DLLs go in mods\.
; A section whose DLL is not installed is ignored, and every setting has the same default in the
; code, so you can delete anything you do not want to change.
;
; The log is engine_fixes.log, next to this file. It names every site that resolved and every
; patch that was applied or refused.


; ==================================================================================================
; loader
;
; dinput.dll. Patches nothing itself; loads every DLL in mods\ at the game's entry point.
; ==================================================================================================
[loader]
Enabled=1

; Where the mods live, relative to WMAIN.EXE.
ModDirectory=mods

; We take the dinput.dll name, so whatever answered to it before needs a new one. Looked up in
; this order: ChainDll, then <game>\dinput_orig.dll, then the system dinput.dll. If you already
; had a graphics wrapper or ASI loader there, rename it to dinput_orig.dll and it keeps working:
; every export is forwarded to it.
ChainDll=


; ==================================================================================================
; variable_fov
;
; Adjustable field of view, with a slider in Options, Video.
; ==================================================================================================
[variable_fov]
Enabled=1

; 0  keep the authored vertical angle and widen horizontally (recommended)
; 1  keep the authored 60 degree horizontal and let the vertical follow the frame
; 2  change nothing, which is what an unpatched executable does
AspectMode=0

; The authored 4:3 vertical angle. 30 to 60.
BaseVerticalDegrees=46.826

; Added on top of the computed horizontal angle. The slider writes this key.
;
; 0 ships, because 0 is the original picture: AspectMode above already keeps the authored vertical
; angle and widens horizontally by exactly what the screen shape asks for, which is 60 degrees at
; 4:3 as the game was made. Anything here is a taste on top of that, and it is not free. A wider
; view shows ground the original never showed while the distance at which an enemy is created has
; not changed, so pop-in becomes visible where it never was. Set it from the slider if you want it.
ExtraDegrees=0.0

; The 3D front end menu uses a fixed focal length and would otherwise shrink into the middle of a
; large screen. 0 fill the screen width, 1 keep 4:3, 2 leave it at 640 pixels.
Menu3dMode=2

; The slider selects an absolute horizontal angle, so these are the numbers its caption shows.
; 60 is the floor because that is the authored angle at 4:3. Steps of 2 degrees.
MenuSlider=1
SliderMinFovDegrees=60
SliderMaxFovDegrees=120

; Slider caption language: en, de, fr, it or es. Empty follows the Windows UI language. The game
; has no language setting to read, since every language shipped as its own release.
Language=


; ==================================================================================================
; framerate_fix
;
; A free render rate that does not change how the game plays. At 30 fps every correction here is
; the identity, so the original behaviour is a fixed point.
; ==================================================================================================
[framerate_fix]
Enabled=1

; Process priority. 0 leaves it alone, 1 above normal, 2 high.
;
; The game is single threaded and saturates one core, so on a many core machine the task manager
; shows a low total while a busy background process takes the drawing thread's time slice. Every
; lost slice is a late frame, and with vertical sync a late frame costs a whole refresh interval.
;
; A precaution, not a repair: it has never been shown to fix anything. A load test with twenty
; eight busy workers on a twenty eight processor machine raised the late frame count measurably
; and changed nothing a player could see. 0 restores the system's own scheduling.
ProcessPriority=1

; 0 removes the frame limiter. Otherwise a cap in frames per second, up to 1000.
TargetFps=0

; Rescale the camera dampers for the real frame time. Without this the camera turns rigid above
; 30 fps.
CompensateCamera=1

; The camera anchor is a fifth damper and the only one that is not a constant, so it needs its own
; switch: this is the one patch here that rewrites instructions rather than an operand. Turn it off
; first if the camera behaves oddly. At 30 fps it changes nothing either way.
CompensateCameraAnchor=1

; The animation clock (water, scrolling textures) and the particle emitter dormancy counter.
CompensateAnimation=1

; Leave at 1. To run the animation clock the engine's own way instead, set CompensateAnimation=0;
; that is smooth but runs the water at fps/30 times its authored speed.
AnimationClockMode=1

; Sleep(1) instead of Sleep(0) in the frame wait. Drops a busy core from 100 percent to a few
; percent, at the cost of up to about 1 ms of overshoot per frame. Off by default because the
; original really does spin.
SpinSleep=0

; Hold the simulation step at 1/32 s so a high frame rate cannot double NPC gravity, the turn ramp
; and the pathfinding rate. Leave this on.
PinSimulationRate=1

; Interpolate the drawn pitch and roll the way the engine already interpolates yaw, and rebuild the
; joint matrices every frame. Neither touches a simulation value.
InterpolatePitchRoll=1
PosePerFrame=1

; A scripted actor asks whether its turn has finished by polling a flag that the animation
; system raises once per rendered frame but that the script reads once per simulation step.
; Below 32 fps some frames run two steps back to back and the second one still sees it clear,
; which is how the shipped game ever took the 'still turning' branch. At or above 32 fps that
; never happens, and a scripted scene whose only progress hangs off that branch stalls for
; good, which in the swamp leaves the player unable to move.
;
; This hands the script a 'still turning' answer on one simulation step in N, and only for a
; clip that has already clamped at its last frame, so nothing visible is delayed. 0 switches
; it off, valid range 2 to 64. The default of 16 gives 2 Hz, which is what 30 fps produced.
FaceLatchYield=16

; Draw doors, lifts and platforms between the simulation steps, the way the engine already draws
; every object in its own list. Without it they hold still for several frames and then move a whole
; step at once, which is what makes them look stepped while everything else is smooth. At 32 fps it
; is the identity.
InterpolateMovers=1

; The furthest a mover may travel in one simulation step, in world units. A larger step is a track
; wrapping back to its start, or a teleport, and is drawn as the jump it is rather than smeared
; across the level. 0 disables the test and leaves only the rotation guard.
MoverTravelLimitPerStep=64.0

; Particle position is a closed form in the clock, so drawing it at the instant the frame actually
; shows gives the exact position rather than a blend. Without this every spark and every smoke puff
; steps at the simulation rate while the world around it moves smoothly.
InterpolateParticles=1

; Compute the frame time in double. The engine subtracts two float32 timestamps that count seconds
; since the process started and are never reset, so their rounding grows with uptime: about 49 us
; of spread after ten minutes and 781 after two and a half hours, which is 12.5 percent of a
; 6.25 ms frame. Everything downstream inherits that, including the simulation accumulator.
PreciseFrameTime=1

; Take the same power of two off the render clock and the simulation clock now and then. Both are
; float32 accumulators, so their rounding grows as the level runs and the interpolation phase
; drifts; every so often a substep is drawn across four frames instead of five, which reads as a
; brief speed pulse. Subtracting from both leaves their difference untouched.
RebaseSimClock=1

; Measurement. Above 0, log a frame time summary every N frames, and dump the player's draw
; interpolation for N frames.
StatsFrameInterval=0
StatsPlayerFrames=0


; ==================================================================================================
; enhanced_resolution
;
; Modern resolutions in the options screen. The game is 16 bit only, so which modes exist at all is
; up to your DirectDraw layer (dgVoodoo2, DDrawCompat).
; ==================================================================================================
[enhanced_resolution]
Enabled=1

; Lift the 4:3 restriction in the mode list. The 640x480 floor and the video memory test stay.
WidescreenModes=1

; Keep the engine's 64 mode records for modes it can actually use.
;
; The engine records every display mode the driver reports, in every bit depth, into a table of
; exactly 64, and it CANCELS the enumeration once that table is full. It then keeps only the
; entries whose bit depth is 16, because there is no 32 bit path in this game. On a driver that
; reports 8, 16 and 32 bit that spends two of every three records on modes the options screen can
; never show, so the list runs out after about 21 resolutions and which 21 depends on the order
; the driver enumerated in. That is why one machine shows every resolution and the next shows a
; third of them.
;
; With this on, a mode that is not 16 bit RGB, or whose resolution is already in the table, is
; answered without taking a record. Nothing is added and nothing the engine would have kept is
; dropped. On a driver that only reports 16 bit there is nothing to filter and this costs nothing.
FilterModeEnumeration=1

; The engine's label array holds 64 entries and does not bounds check, so cap what the enumerator
; returns. 4 to 63.
MaxMenuModes=63

; 0 leaves obi.ini alone. Otherwise force the startup resolution.
ForceWidth=0
ForceHeight=0

; Print the raw DirectDraw mode table to the log once, when it is first enumerated.
LogModeTable=0

; Stop every menu switching to 640x480, which costs a full device rebuild each time. The front end
; and the pause screens then sit as a 640x480 island in the middle of the picture.
MenuKeepsResolution=1

; Last resort, off by default. Moves and resizes the game window to match the display mode.
;
; Turn this on only if nothing renders at all and you have no wrapper installed, because that is
; the one case where the window can really end up smaller than the display mode. It costs you the
; engine's assumption that its window sits at screen 0,0, which its own pointer handling depends
; on, and it has produced a 2 fps report before: the window followed the mode down to 640x480 and
; the wrapper then downscaled a 2560x1440 render into it every frame.
FitWindowToMode=0

; Recentre the pointer in the window rather than at the fixed screen point the engine warps to.
; Identity while the window is at screen 0,0, which is where the engine always left it. Released
; while another application is in front, so Alt Tab always frees the pointer.
KeepCursorInWindow=1

; Keep the pointer inside the window while the game is in front, and let go the moment it is not.
; Without it the pointer can cross the window edge between two mouse messages, walk onto a second
; monitor, and the next click takes the focus away. Released on Alt Tab, the Windows key, the task
; switcher, a minimise and on exit.
ClipPointerToWindow=1

; Reacquire the DirectInput keyboard and mouse when the window comes back to the front. Windows
; unacquires both when the game goes to the background and nothing in the retail build ever
; acquires them again, so without this the game stops answering the keyboard after the first
; Alt Tab.
ReacquireInputOnFocus=1

; Widen the area the menu cursor may be moved in, from the 640x480 box the engine clamps it to up
; to the whole display mode. This is not about where menus are drawn; the engine already centres
; those correctly. It is the cursor clamp, which at 1920x1080 leaves a box in the middle of the
; screen the pointer cannot leave. At 640x480 the computed clamp is identical to the shipped one.
;
; Reported cost, not reproduced here yet: the pause screens repair themselves through damage
; rectangles clipped to that same 640x480 box, so a cursor moved outside the menu island cannot be
; erased, and crossing the island's edge may leave a permanent blue stamp of the cursor's glow on
; the border until the menu closes. Every clickable widget is inside the island anyway, so set this
; to 0 if you see that. The setting below is a different defect and does not cover the cursor.
WidenMenuCursorArea=1

; Clamp the menu's own sprite draws to the 640x480 island, but only while the engine's widget pass
; is what is drawing; the gameplay HUD and the frozen pause backdrop pass through untouched. This
; is the other half of MenuKeepsResolution: with the menus keeping a large resolution, a sprite
; that reaches past the island, the hovered button's halo does, is drawn against the screen but
; repaired against the 640x480 canvas, so it stamps the island's border until the screen closes. A
; sprite that fits the island, which is every authored widget, passes through bit-identical, and so
; does a partially filled one, so this costs nothing when nothing is wrong. Leave it on.
ClampMenuSpritesToIsland=1


; ==================================================================================================
; hud_ratio_scaling
;
; One size knob for the HUD, and glyphs that are not stretched.
; ==================================================================================================
[hud_ratio_scaling]
Enabled=1

; Make glyphs square outside the HUD. The renderer scales text by (W/640, H/480), so at 16:9 every
; character is a third too wide. Identity at 4:3.
SquareText=1

; Derive the bar widths from the screen height, the way the weapon icon already does, so the bars
; keep their authored shape at any aspect ratio. Identity at 4:3.
SquareHud=1

; One multiplier for the whole HUD: bars, weapon icon and both numbers, each about the edge it is
; anchored to. 0.25 to 4.0. With SquareHud=0 and HudScale=1.0 nothing is hooked at all, and a new
; value then needs a restart.
HudScale=1.0


; ==================================================================================================
; fmv_player
;
; Replaces the whole playback path for the pre-rendered movies. Where a converted file exists
; (tools\"Convert Movies.bat" makes them from your own copy of the game) it plays through a 32 bit
; libVLC in a borderless window over the game, never touching the engine's DirectDraw surface. A
; movie with no converted file falls through to Bink unchanged, so this is safe to install with
; nothing converted yet.
;
; Four things switch the feature off at startup and each says so in the log: Enabled=0, an
; unsupported build, the movie folder missing, and no 32 bit libVLC found. The cheap checks run
; first, so a machine with nothing converted never loads libVLC.
;
; The installer puts a libVLC in mods\fmv, and failing that a 32 bit VLC on the machine is used. A
; 64 bit VLC cannot be used at all, because this is a 32 bit process.
; ==================================================================================================
[fmv_player]
Enabled=1

; Where converted files live, relative to WMAIN.EXE. A retail movie name like "movie\arena" is
; looked up as <MovieDirectory>\arena.<Extension>, flat, no extra "movie\" subfolder beyond this
; one. The folder not being there is what tells this feature it has nothing to do, so libVLC is
; never loaded on a machine with nothing converted.
MovieDirectory=movies_hd
Extension=mp4

; Letterbox or stretch.
;
; The movies are roughly 4:3 and almost no screen is, so something has to give. letterbox
; keeps their own shape and puts black bars at the sides. stretch pulls the picture out to
; fill the screen exactly, which loses no image but makes faces a little wider.
;
; The choice is made when the movie plays, not when it is converted, so it applies to files
; you already have and costs nothing to change your mind about. Anything other than the word
; stretch is read as letterbox.
Scaling=letterbox


; ==================================================================================================
; view_distance_fix
;
; Draw distance, fog and NPC activation range.
;
; Draw distance and fog are two numbers the engine does not connect, and the frame is cleared to
; the fog colour. Raising the range on its own costs fill rate without showing one extra pixel,
; which is why the two are coupled here.
; ==================================================================================================
[view_distance_fix]
Enabled=1

; 1.0 to 2.0. The cell watchdog only ever lowers this at run time, never raises it.
ViewRangeScale=1.0

; Scale each level's authored fog band with the picture, so a wider field of view brings the fog in
; with it. At the authored 60 degrees every level keeps its shipped numbers exactly.
FogFollowFov=1

; Also cap the band so that geometry appears behind opaque fog instead of at a visible edge.
;
; This changes the authored look, and by a lot: ten of the eleven levels end their fog well behind
; their own draw distance. It loses nothing you could see, because everything past the cut edge is
; the fog colour anyway, but it is a different picture from the one that shipped. 0 keeps every
; level's authored band and accepts the edge.
FogInsideCut=1

; How long a fog change takes, in seconds. A level load snaps instead. 0 steps immediately.
FogSettleSeconds=1.5

; 0 follows ViewRangeScale. Otherwise 1.0 to 4.0.
FogScale=0.0

; The engine picks one of two fog paths from a device capability. A modern wrapper reports that
; capability, so the engine hands its world unit fog band to the device as table fog, the device
; measures it in device depth, and nothing is ever fogged. 1 answers that question with no, which
; puts the engine's own per vertex fog back in charge. 0 leaves it as the device asks.
VertexFog=1

; How far away an NPC is created, as a multiple of the distance the level authored. 1.0 is the
; engine's own value and patches nothing.
;
; This is the one setting here that changes how the game plays, so it ships at 1.0. The engine's
; test is a plain distance with no view direction in it, so a larger value does not widen the
; picture, it creates every actor earlier in every direction, straight ahead included. An actor
; created earlier also thinks earlier.
;
; Raise it only if you would rather hide pop-in than keep the original behaviour. Pop-in is more
; visible here than it was in 1999 because the field of view is wider, so the picture reaches
; sideways into ground the original never showed, where placements are in view before their
; authored distance is reached. 1.0 to 2.0.
NpcRangeScale=1.0

; Draw dismembered bodies two sided, at most N per frame. This softens the see through look. It
; does not close the hole, because a severed limb is not a cut mesh.
TwoSidedSevered=1
TwoSidedMax=8

; Move the cell table into a larger buffer, which lets its limit rise from 8192 to 16384. The
; alternative lowers the limit to 7168 instead and costs distance; it is skipped automatically
; while the relocation is active.
RelocateDrawTable=1
LowerCellLimit=1


; ==================================================================================================
; dismemberment
;
; Lightsaber dismemberment: the limb the blade actually hit, and only on the killing blow.
; ==================================================================================================
[dismemberment]
; 0 off, 1 only correct which limb is severed, 2 also sever on the killing blow.
Mode=2

; The flight of the severed piece. The engine's own values are extreme: up to 211 degrees per
; second of tumble, and five times the world's gravity.
SpinScale=0.35
GravityScale=0.40
YawScale=0.12

; The rest state the engine does not have. After SettleSeconds the piece lies still for good;
; before that the tumble is damped by SettleDamping each step.
SettleSeconds=1.20
SettleDamping=0.80

; Measurement. Records the full state of every flying piece.
Diagnostics=0


; ==================================================================================================
; enhanced_input
;
; Mouse look, sideways walking and free look.
;
; Strafe needs MouseLook. The engine has one turn channel, so turning the keyboard axis into
; strafing means clearing it, and without mouse look the character could not turn at all. The DLL
; enforces this and says so in the log.
; ==================================================================================================
[enhanced_input]
MouseLook=1

; Degrees of view turn per mouse count.
;   0.100   4.5 inches for a full turn at 800 DPI, which is what this ships at
;   0.045   10 inches
;   0.030   15 inches
;   0.0225  20 inches
; The MOUSE SPEED slider on the controls screen writes this key and takes effect at once. It reads
; 1 to 100, which is this number with the decimal point moved: 0.100 shows as 100.
;
; The shipped value is fast, and deliberately: it is the one the mouse path was tuned and played
; at. Anyone who wants the older, slower feel writes 0.030, and the slider is the easier way to
; find their own number.
MouseDegreesPerCount=0.100

; Collect the mouse once per rendered frame and hand the whole amount to one simulation step. The
; engine polls after the steps have already run, so without this most of the hand movement is
; overwritten unread at a high frame rate. 0 restores the old per step read.
MouseAccumulate=1

; Read the mouse straight from the device (WM_INPUT) instead of through the game's DirectInput
; device.
;
; The game's own reader answers a sum of everything since it was last asked and throws the timing
; of the individual reports away. That timing is what smooth motion needs: the simulation consumes
; at a fixed 32 steps a second, so a 100 Hz mouse puts three or four whole reports into each step,
; and the difference between three and four is a third of the turn. Raw input keeps it, which is
; what removes the boundary error for free and lets the smoothing below size itself.
;
; Nothing else changes: the pointer still works in the menus and the game's device stays open. If
; raw input registers and then delivers nothing, which some remote sessions and filter drivers do,
; the game switches back by itself after two seconds and says so in the log.
MouseRawInput=1

; The MENU pointer, which is a different consumer of the same device. The engine moves it by the
; whole-pixel difference between the system pointer and a hard-coded (320,240): everything under one
; pixel is discarded rather than carried, travel is lost whenever the system pointer runs into a
; screen edge (that centre is the middle of a 640x480 screen, not of yours), and the machine's
; pointer acceleration rides along. This drives it from the device instead and keeps the remainder in
; floating point. The engine's own accumulation, its clamp and its hit testing all still run; only
; the number handed to them changes. Needs MouseRawInput=1, and it does nothing while the device
; reader is silent, because a frozen pointer would be worse than a stepping one.
MenuCursorRawInput=1

; Guard against a broken device, not against you: a single sample above this rate is cut back
; before it is used, and anything the guard holds back is delivered on the following frame rather
; than thrown away. The default is far above any hand, since a fast flick of the wrist is 1200 to
; 1800 degrees per second.
MouseSpikeLimitDegPerSec=3000

; Measurement. One line per sample the guard above had to cut. A healthy session logs nothing.
MouseLog=0

; Measurement. Degrees the camera may turn in one frame before it is worth a line in the log.
; Changes nothing, reports only. 0 switches it off.
CameraJumpWatchDeg=0

; Smoothing, and it is a ceiling on delay rather than an amount. The game measures how often your
; device reports and asks for six of its intervals, so a 1000 Hz mouse costs 6 ms and a 30 Hz
; injected pointer 200.
;
; You only need it if your pointer is not really a mouse. A remote desktop or a streaming client
; injects one that reports far more slowly than the game consumes, and the turn then arrives in
; lumps that nothing but averaging can smooth. 60 to 120 is sensible in that case. It was on by
; default once and that build was rejected in a single sitting for input lag.
;
; Leave the line commented out unless you want to decide it yourself. With no value the game picks
; per control mode, and the two want opposite answers: the classic path lets a simulation step
; consume the mouse, and a step is three times as long as a frame, so the sampling boundary hardly
; matters; NewMouseInput draws per frame, where a 125 Hz mouse puts one and a half reports into a
; frame and the boundary is most of that frame's movement. Left alone it is off for the first and
; up to 16 ms for the second. Any value here wins, including 0, which switches it off everywhere.
;MouseSmoothMaxMs=0

; How fast A and D turn the player, in degrees per second, while sideways walking is off. 120 is
; the engine's own ceiling, which is the original feel.
KeyTurnRate=120

; Let the camera follow the body directly instead of easing toward it. The engine's easing is
; ample for a keyboard, which can only turn 120 degrees per second, and far too slow for a mouse
; that can turn a quarter circle in one step. Cutscenes, scripted cameras and fixed camera regions
; keep the engine's easing regardless. 0 restores the engine's own camera behaviour.
MouseLookRigidCamera=1

; Turn the view with the mouse once per drawn frame instead of once per simulation step.
;
; The game advances your facing 32 times a second and interpolates the frames in between. A held
; turn key asks for the same amount every time, so that interpolation draws a straight line and the
; turn is smooth. The mouse does not: what your hand did between two steps differs every time, so
; several frames are drawn at one rate and then it changes, 32 times a second. That is what "the
; mouse feels stepped while the keys feel fine" is.
;
; With this on the drawn angle advances by what your hand did on that frame and the simulation gets
; the total afterwards. You still turn exactly as far; the camera shows it as it happens rather
; than up to a step later. The one visible consequence is that during a fast sweep the camera runs
; at most one step ahead of the body, where it used to run the same amount behind. Shots still
; leave along the body.
;
; Needs MouseLook=1, MouseAccumulate=1 and MouseLookRigidCamera=1, and the log names the missing
; one. No effect while FreeLook=1, which turns the camera with the mouse anyway.
;
; It measures itself: play a few seconds at 0 and again at 1, one sitting, same hand speed, and the
; log prints a line each time. Read the ratio of how much rougher the frames that ran a simulation
; step are than the frames that did not. That ratio is the stepping, and it should fall toward 1.
NewMouseInput=1

; Measurement. Above 0, write that many consecutive lines into the log from the first fast mouse
; sweep of the session, one per drawn frame, then stop. It answers the one question an average
; cannot: whether a frame drew almost nothing and the next one drew double, which is what "it
; skips frames" is, or whether the sweep simply sped up. 120 covers a whole flick.
NewMouseInputDump=0

; Sideways movement is the engine's own walk or run pointed in another direction, so it has no
; speed of its own: it is the gait you are already in, with the matching animation, footsteps and
; acceleration. The check box on the controls screen writes this key.
Strafe=1
StrafeInvert=0

; Turn the body to face the way it travels, so a sideways walk shows the character's side rather
; than his back sliding. The camera does not follow that turn, which is the point of it.
StrafeTurnsBody=1

; How long the travel angle takes to close most of a change, in milliseconds, and the hard rate cap
; on it in degrees per second. Without the damping the angle steps between 0, 45 and 90 degrees in
; a single step and no animation blend can hide it. 0 ms restores the instant step.
StrafeSettleMs=250
StrafeTurnRate=240

; Lean the upper body into a turn. The engine twists chest and head from its own turn rate, which
; mouse look has to clear, so the twist was being computed from a number that no longer meant
; anything. This reissues both writes with the engine's own value. Mouse look only: under free look
; that same cell carries the mouse, and there the mouse is the camera.
SteerLean=1

; Let that lean follow your hand instead of the engine's turn cell.
;
; Only one thing in the game ever lowers that cell: an outright store of zero, taken whenever the
; mouse axis reads nothing on a step. The axis is refilled once per drawn frame, so a frame that
; carried no report from the mouse makes the next step read "the hand stopped", and the shoulders
; and head snap back to centre and climb out again, many times a second. The faster the game draws
; the more often it happens, which is why it shows here and did not on a 1999 machine. This uses
; the same hand speed the view is already turned by, which is smooth by construction.
;
; A held turn key is untouched. There the engine's own climb to full rate IS the lean, and it is
; used exactly as before. Needs SteerLean=1 and MouseLook=1.
SteerLeanFromHand=1

; Hand the engine back its turn rate instead of a zero. Nine other places read that cell as how
; hard the player is turning, and the speed penalty on turning is the one you feel. It does not
; reach the follow camera, which overwrites that cell with its own number before it looks at it.
RestoreTurnRate=1

; Measurement. Above 0, print that many steps in which you were actually steering, then stop. Each
; line names which control scheme took the step, the angles, and what the upper body twist did.
; 60 is plenty: walk, turn, and hold fire for a second.
SteerLog=0

; Measurement. Non zero forces chest and head to this fixed angle, ignoring the turn and the
; damping. It answers one question: does a rotation of the upper body reach the screen at all.
; Try 45, then set it back to 0.
SteerLeanTestDegrees=0


; ---- free look -----------------------------------------------------------------------------------
; The second control scheme, mutually exclusive with the one above. The mouse turns the camera and
; no longer turns the body; the body turns toward whichever direction you ask to travel, measured
; from the camera. Needs MouseLook=1. Horizontal only: the pitch is not touched.
;
; Two things change. Holding back is a half turn and a walk toward the camera, so the backward
; animation is retired, and walking into one of the game's fixed camera regions is noticed one
; frame late. The check box on the controls screen writes this key and takes effect at once.
FreeLook=0

; How long the body takes to close most of a turn toward your direction of travel, in milliseconds,
; and the hard rate cap on that turn. The engine's own 120 degrees per second needs three quarters
; of a second for a right angle, which is far too slow once the camera has been flicked. 0 snaps.
FreeLookBodyTurnMs=150
FreeLookBodyTurnMaxDegPerSec=540

; While an attack is live, turn the body to face the camera for a moment, so the shot and the force
; push follow where you are looking rather than where your feet point.
FreeLookAimSnap=1

; While the fire button is held, keep steering with your keys. The body faces the camera and the
; feet strafe relative to it, which is what the game does with free look switched off, so aiming
; feels the same in both schemes. 0 restores the older behaviour, where holding fire took the body.
FreeLookAimKeepsMovement=1

; How far the upper body may be twisted away from the feet, in degrees. The same number aims the
; shot and turns the chest, so a shot never leaves along a line the weapon is not on. 90 lets you
; strafe sideways and shoot along the strafe. Lower it for a stiffer pose and a shorter aim.
FreeLookAimTwistMax=90

; Walking over a floor that belongs to a fixed camera region hands the camera to the engine, which
; swings it toward that region's authored angle. Up to this many degrees of that swing are taken
; back when the region lets go; past it the swing is treated as a real re aim and kept. This is
; what "the camera sometimes turns on its own while walking" was. 0 switches it off. A cutscene
; never recovers, because it places its shot on purpose.
FreeLookRegionRecoverDeg=25

; Measurement. One line per change of free look's arming gate, never one per frame, capped at 400 a
; session. Switch it on only when chasing a camera that turns on its own.
FreeLookLog=0


; ==================================================================================================
; imuse_fix
;
; Music that pauses when you Alt Tab, and a music thread that cannot lock itself up.
; ==================================================================================================
[imuse_fix]
Enabled=1

; Pause the music while another application is in front and resume it on the way back. The engine
; never does: its window procedure routes the focus message to two functions and both are about the
; mouse pointer. Only music the game is actually playing is paused.
PauseMusicOnFocusLoss=1

; Resume a pause that nobody owns. Fires only while the game is in front, the pause menu is not up,
; and this DLL is not the one that paused. It never pauses anything.
ResumeOrphanedPause=1

; How many consecutive frames an ownerless pause has to persist first. 12 to 6000.
OrphanGraceFrames=120

; Measurement. One line per change of the music state, capped at 400 a session.
MusicLog=0

; Measurement. Reads two cells in the music DLL once per frame and writes nothing: how many
; heartbeats have run, and whether the lock is held. A stall then shows as two numbers.
MusicProbe=0

; Seconds between routine "still alive" lines. 0 says nothing unless the heartbeat stalls.
MusicProbeSeconds=10

; Measurement. Copies the music DLL's own running commentary into the log: the sequence it is
; switching to, the file it is opening, the script errors it refuses. Makes the log large.
MusicTrace=0

; The repair. The music does not stream on the game's thread: a multimedia timer refills the buffer
; about 50 times a second, and that buffer loops, so a stopped refill does not fall silent, it
; circles its last fragment forever. The refill is gated on a counter both threads change without
; interlocked instructions, and a lost decrement can only ever leave it stuck held.
;
; This makes both sides of that counter atomic, and refuses the five parameter ranges whose refusal
; inside the music DLL keeps the lock forever. One such call is enough to end the music for the
; session. Two writes into the mapped DLL at run time; the file on disk is never touched. If either
; half cannot be installed, both are rolled back rather than shipping half a repair.
MusicLockFix=1

; The net behind it, and it only ever releases. If no refill has run for this many milliseconds
; while the timer is still firing and the lock is held, the lock is written back to zero. It cannot
; underflow, because the engine's own release tests for zero before it decrements.
MusicHeartbeatWatchdog=1
MusicHeartbeatWatchdogMs=400

; Reproduction tool, not a feature. Drives music changes this many times a second to provoke the
; stall on purpose. The music will stutter and cut while this is on. 0 is off.
MusicStressHz=0


; ==================================================================================================
; crash_report
;
; On a crash, writes the exception code, address, module, registers and the engine frames from the
; stack. Changes nothing about how the crash unfolds, and costs nothing until one happens.
; ==================================================================================================
[crash_report]
Enabled=1


; ==================================================================================================
; crt_copy_fix
;
; An inlined copy loop in the original reads four bytes before its source, in 40 places. Invisible
; on the heap, fatal on a locked surface whose preceding page is not mapped.
; ==================================================================================================
[crt_copy_fix]
Enabled=1


; ==================================================================================================
; decal_fix
;
; Ground shadows, scorch marks and footprints, which a Direct3D 9 translation layer drops.
;
; A decal is the ground polygon itself, drawn again at exactly the same depth. The only thing that
; normally lets it win the depth test is a render state Direct3D 9 removed, so the engine asks for
; something the device cannot give it and the decal loses. The fix is to stop asking.
; ==================================================================================================
[decal_fix]
Enabled=1

; The repair itself: stop the decal branch asking for the depth bias the device cannot give it.
; Leave this on. With it off the DLL installs and does nothing.
NeutraliseZBias=1

; Optional extra push toward the camera, in device depth. 0 is correct, because the engine relies
; on its decal sitting at exactly the ground polygon's depth and relaxes the depth compare for it.
; This was the first theory about the defect and it is not the fix. Raise it only if your
; translation layer cannot reproduce an exact float equality; above 0.01 it is clamped.
DepthBias=0.0

; Instruments, both off. They clear and set bits in the decal's render state word before it
; reaches the device, so a suspect bit can be tested in one run instead of one rebuild each. The
; word asks for at least two things Direct3D 9 removed, and a translation layer may honour, drop
; or mistranslate either. At 0 the word reaches the engine exactly as it left it.
StateClear=0
StateSet=0


; ==================================================================================================
; sfx_volume_save_fix
;
; The SFX volume slider came back at (about) full on every reload, whatever it was set to.
;
; Two separate bugs in the 1999 code. The value written to obi.ini's SVOL came from asking the
; sound driver rather than reading the engine's own copy of what it had last set. And the value
; loaded back at startup was applied one statement before the engine marked sound as ready, while
; the function that applies it does nothing at all until that flag is up, so the load was a silent
; no-op on every launch. Both are repaired without editing the engine's instruction order.
;
; A slider notch is not the test: the menu's own arithmetic truncates in both directions, so notch
; 5 saves as SVOL=33 and 33 seeds back as notch 4. Check SVOL= in obi.ini, not the slider.
; ==================================================================================================
[sfx_volume_save_fix]
Enabled=1


; ==================================================================================================
; diagnostics
;
; Observation only. Every hook calls the original and changes nothing, and with Enabled=0 this DLL
; does not touch one byte of the image. The stream goes to engine_fixes_diag.log.
;
; Levels: 0 off, 1 events, 2 also the detailed traffic.
; ==================================================================================================
[diagnostics]
Enabled=0

Audio=0
Music=0
Trigger=0
Fsm=0
Level=0
Player=0
Dialogue=0

; Fx has a third level. 2 reports every decal stamped into the pool, 3 also reports every decal
; drawn and which of the drawer's two silent exits swallowed it. A decal that is stamped is not a
; decal that is drawn. Level 3 is loud: one line per decorated polygon per frame.
Fx=0

; Count the NPC spawns the engine refuses. When an actor should be created the engine takes a
; record out of two pools that are fixed at start-up, 128 actors and 255 things, and a full pool
; makes the spawn return zero without writing anything anywhere. The placement is skipped and the
; enemy is simply not there. Switch this on before asking anybody to reproduce a missing enemy.
;
; This one is read by view_distance_fix, which owns the site, not by the diagnostics DLL. It sits
; here because this is where measurements live, and it works whether or not Enabled above is set.
Spawns=0

; Above 0, list the occupied sound channels every N milliseconds. Minimum 100.
AudioCensusMilliseconds=0

; Flood protection, in lines per second. 0 is unlimited. Repeated identical lines are always
; collapsed and counted regardless.
MaxLinesPerSecond=60

; Mirror every diagnostic line into engine_fixes.log as well.
AlsoToMainLog=0

; Why the PICTURE stutters, which is a different question from what the game is doing. The only
; observer here that watches the machine rather than the engine.
;
; 1  one line a second: frames drawn, median and worst frame time, hitches, process and machine CPU
;    load, page faults a second, working set, graphics load.
; 2  plus the frames on either side of every hitch. An average over a second cannot show a single
;    late frame, and a single late frame is what the complaint is about.
;
; A hitch is measured against the session's own median rather than a fixed number of milliseconds,
; because the same build runs at 30 frames a second and at 300. Beside each frame stands what the
; engine believed that interval was, so a disagreement shows the world advancing by one number
; while the picture stood still for another. It installs no hook and samples on its own thread, so
; it cannot become a cause of what it is looking for.
Frame=0

; How far past the median counts as a hitch, in per cent. 0 uses the default of 60, which at 90
; frames a second is about half a frame late.
FrameHitchPercent=0

; The Windows performance counter the graphics load is read from. Counter names are localised, so
; on a non English Windows the default will not resolve and the log says so. Put the local name
; here; everything else in the line works without it.
FrameGpuCounter=\GPU Engine(*engtype_3D)\Utilization Percentage

; Which of the engine's two presentation paths this installation uses. The engine chooses per
; display device between a GDI BitBlt into the window and a DirectDraw flip, and that decides what
; can be done about presentation at all: a DirectDraw wrapper owns the flip and its settings reach
; it, while the BitBlt goes past any wrapper straight into the window. A third answer exists,
; DirectDraw with no back buffer, on which the engine's present succeeds without presenting.
;
; One line, not a stream, read at the first frame with the display open and printed again only if
; it changes. Level 2 adds the addresses it resolved.
Present=0


; ==================================================================================================
; render_guard
;
; Two unbounded writes in one engine function. The deferred face path keeps a 32 byte outcode array
; on its own stack frame and writes one entry per vertex without checking the count, so the 33rd
; vertex of a face lands on the saved return address; and the vertex pool cursor is advanced with no
; ceiling at all. Neither is reachable by the artwork the game ships, which is why the engine has
; run for a quarter of a century with them, and both are reachable by replacement artwork.
;
; The third setting is a repair rather than a guard. The mapper that turns the device's depth
; comparison capabilities into a Direct3D compare function can answer 0, which Direct3D does not
; define. Only the LESS capability produces it, so 0 becomes LESS and every other answer passes
; through untouched.
; ==================================================================================================
[render_guard]
Enabled=1

; The most vertices one deferred face may carry. The engine's own array holds 32 and its 33rd entry
; is the return address, so 30 leaves two spare. A face past this is refused the same way the
; engine refuses one when its queue is full, which is a path the engine already handles.
MaxDeferredVertices=30

; The ceiling on the shared vertex pool. Read from the engine's own queue limit at install where
; that can be resolved; this value is the fallback and the plausibility bound on it.
PoolCapacityVertices=8196

; Turn an undefined depth comparison answer into LESS. 0 disables only that repair and leaves both
; bounds above in place.
GuardDepthCompare=1


; ==================================================================================================
; effect_clock
;
; Three effects re-roll their random numbers once per RENDERED frame. In 1999 that was once every
; thirty-third of a second and it read as an authored flicker. At 240 frames a second the same code
; re-rolls eight times as often, and lightning, flicker and halo all turn into noise that averages
; into a steady blur. None of them has any geometry state, so there is nothing to interpolate; the
; repair is to put them back on the rate they were authored for.
;
; A side effect worth knowing about: the drawing path no longer advances the engine's global random
; generator, so the simulation's own sequence stops depending on how many frames were drawn. The
; original was already frame rate dependent there.
; ==================================================================================================
[effect_clock]
Enabled=1

; The lightning. Off leaves the arcs re-rolling once per rendered frame.
PaceLightning=1

; How many simulation steps one bolt shape survives. 1 is the authored rate. Larger numbers hold a
; shape longer, which reads as slower lightning rather than as smoother lightning.
SubstepsPerRoll=1

; An object carrying the flicker flag is skipped entirely, animation included, when a draw lands
; under a fifth. That draw happened once per rendered frame, so above 32 frames a second the object
; flickered faster the better the machine was.
PaceFlicker=1

; A halo's brightness gets up to four tenths added at random and is then clamped, once per object
; per rendered frame, so it twinkles at the authored rate and averages into a steady blur above it.
PaceHalo=1


; ==================================================================================================
; large_textures
;
; Not a fix. The largest page in the original artwork is 64 pixels on a side, so on the game as it
; shipped this is the identity. It exists so replacement textures can be larger than 1999 hardware
; allowed.
;
; The engine clamps every texture page to 256 pixels per axis and crops what is larger: a 512 wide
; page is created at 256 and only its leftmost columns are copied. One immediate governs both axes.
;
; The engine never asks the device for its own maximum, so an impossible ceiling here shows up only
; as surface creation failing, which degrades to untextured through the engine's own failure path.
; ==================================================================================================
[large_textures]
Enabled=1

; Pixels per axis. 256 is the engine's own value and means change nothing. Range 256 to 8192,
; powers of two only.
MaxTextureSize=1024

; The world geometry pages are a separate ceiling and are left at the engine's own 256 by default,
; because raising that one costs video memory on every level whether the artwork uses it or not.
MaxWorldPageSize=256
