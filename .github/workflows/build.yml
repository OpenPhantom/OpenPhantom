# Builds both C projects and runs the unit tests on every push and pull request.
#
# WHY THIS EXISTS. Two claims in this repository were made by nothing but prose until now:
# legacy/README.md says the tree "builds clean with MSVC x86 at /W4 /WX, no warnings", and
# legacy/CONTRIBUTING.md lists a green ctest run as a gate before handing work over. Both are true
# today and neither was checked by anything, so the day one stopped being true, the README would
# have gone on saying it.
#
# It also catches a failure this project has actually had: an edit that silently did not apply.
# Warnings-as-errors and a test suite only help if something runs them on a clean checkout rather
# than in a working tree where the previous build is still lying around.
#
# Two more claims are checked at the end. Every shipped binary carries a version resource, so a
# log or a properties dialog can name its build; and the extractor imports nothing but kernel32,
# because it runs on the player's machine while the installer does and Windows does not ship the
# Visual C++ runtime. The dynamic build once shipped, and on a machine without the redistributable
# the installer stopped at "Expanding" with an exit code and nothing to read.

name: build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # -A Win32 is not optional. Every offset and pointer patch in legacy/ assumes a 32-bit
      # process, and the CMakeLists refuses any other word size rather than producing a binary that
      # cannot load beside a 1999 executable.
      - name: Configure the patch, 32-bit
        run: cmake -S legacy -B legacy/build -A Win32

      # /W4 /WX comes from the CMakeLists, so a new warning fails this step. That is the point.
      - name: Build the patch
        run: cmake --build legacy/build --config Release

      # None of these needs the game, a window or a graphics device, so the whole suite runs in
      # about two seconds. --output-on-failure so a red run says which check text failed rather
      # than only which executable did.
      - name: Run the unit tests
        run: ctest --test-dir legacy/build -C Release --output-on-failure

      - name: Configure the installer's extractor, 32-bit
        run: cmake -S installer/src/is3_extract -B installer/src/is3_extract/build -A Win32

      - name: Build the installer's extractor
        run: cmake --build installer/src/is3_extract/build --config Release

      # Proof the build produced what it claims to, rather than succeeding with nothing to show.
      # A configure step that silently matches no sources still exits zero.
      - name: Check the artefacts exist
        shell: pwsh
        run: |
          $loader = 'legacy/build/dist/dinput.dll'
          $mods = Get-ChildItem 'legacy/build/dist/mods/*.dll' -ErrorAction SilentlyContinue
          $extractor = 'installer/src/is3_extract/build/Release/is3_extract.exe'

          if (-not (Test-Path $loader)) { throw "the loader was not built: $loader" }
          if (-not (Test-Path $extractor)) { throw "the extractor was not built: $extractor" }
          if ($mods.Count -lt 1) { throw 'no feature DLLs were built' }

          Write-Output "loader:    $loader"
          Write-Output "extractor: $extractor"
          Write-Output "feature DLLs built: $($mods.Count)"
          $mods | ForEach-Object { Write-Output ("  " + $_.Name) }

      # Every file that ships names its build. A resource that compiles with its block name and
      # translation disagreeing reads back empty, so the string is asked for rather than the
      # resource's presence.
      - name: Check every shipped binary carries a version resource
        shell: pwsh
        run: |
          $shipped = @('legacy/build/dist/dinput.dll',
                       'legacy/build/dist/tools/openphantom_convert.exe',
                       'installer/src/is3_extract/build/Release/is3_extract.exe') +
                     (Get-ChildItem 'legacy/build/dist/mods/*.dll' | ForEach-Object { $_.FullName })
          foreach ($file in $shipped) {
            $version = (Get-Item $file).VersionInfo.FileVersion
            if ([string]::IsNullOrWhiteSpace($version)) { throw "no version resource: $file" }
            Write-Output ("{0,-40} {1}" -f (Split-Path $file -Leaf), $version)
          }

      # The extractor runs on the player's machine, so it may depend on nothing Windows does not
      # ship. dumpbin comes with the toolset the build above used.
      - name: Check the extractor imports only kernel32
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x86\dumpbin.exe" | Select-Object -First 1
          $imports = & $dumpbin.FullName /dependents installer/src/is3_extract/build/Release/is3_extract.exe
          $dlls = $imports | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim().ToUpperInvariant() }
          Write-Output "imports: $($dlls -join ', ')"
          $foreign = $dlls | Where-Object { $_ -ne 'KERNEL32.DLL' }
          if ($foreign) { throw "the extractor depends on a runtime Windows does not ship: $($foreign -join ', ')" }
